<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NEXORA POS">
<title>NEXORA POS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%233b5bdb'/%3E%3Cpath d='M14 34V14l20 20V14' stroke='%23fff' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f4f7; --card:#fff; --ink:#0f172a; --ink2:#334155; --muted:#64748b; --line:#e3e7ee;
  --nav:#0b1220; --nav2:#1a2436; --accent:#3b5bdb; --accent2:#e8edff;
  --ok:#16a34a; --ok2:#e8f7ee; --warn:#e8930c; --warn2:#fff4e0; --info:#2f74e0; --info2:#e6f0ff;
  --bad:#dc2626; --bad2:#fdecec; --r:14px; --sh:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- layout ---------- */
#app{display:flex;height:100vh;height:100dvh}
.nav{width:88px;flex:none;background:var(--nav);color:#aab4c6;display:flex;flex-direction:column;align-items:center;padding:14px 0 10px;gap:4px;overflow-y:auto}
.brand{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:12px;color:#fff;font-weight:800;font-size:11px;letter-spacing:.08em}
.brand svg{width:34px;height:34px}
.nav .nb{width:74px;padding:10px 4px 8px;border-radius:12px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative}
.nav .nb svg{width:22px;height:22px}
.nav .nb:hover{background:var(--nav2);color:#fff}
.nav .nb.on{background:var(--accent);color:#fff}
.nav .badge{position:absolute;top:4px;right:10px;background:var(--bad);color:#fff;border-radius:99px;font-size:10.5px;min-width:18px;height:18px;line-height:18px;padding:0 5px;font-weight:700}
.nav .sp{flex:1}
main{flex:1;min-width:0;overflow:auto;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top h1{font-size:20px;font-weight:750;letter-spacing:-.01em}
.top .grow{flex:1}
.uchip{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;border:1px solid var(--line);border-radius:99px;font-size:13px;color:var(--ink2)}
.uchip b{font-weight:650;color:var(--ink)}
.uchip button{background:var(--bg);border-radius:99px;padding:5px 10px;font-size:12.5px;font-weight:600}
.wrap{padding:20px 22px 40px}
.demo-bar{background:#fff7d6;color:#7a5a00;font-size:12.5px;text-align:center;padding:5px 10px;border-bottom:1px solid #f1e3a6}

/* ---------- generic ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 16px;border-radius:11px;font-weight:650;background:var(--card);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#c9d0dc}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:34px;padding:0 11px;font-size:13.5px;border-radius:9px}
.btn.lg{min-height:52px;font-size:16.5px;padding:0 22px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap;padding:0}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600;color:var(--ink2)}
.inp,select.inp,textarea.inp{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}
textarea.inp{min-height:70px;resize:vertical}
.chk{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer;min-height:36px}
.chk input{width:19px;height:19px;accent-color:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--bg);color:var(--ink2);white-space:nowrap}
.tag.ok{background:var(--ok2);color:#0f7a37}
.tag.warn{background:var(--warn2);color:#9a5b00}
.tag.info{background:var(--info2);color:#1d55b5}
.tag.bad{background:var(--bad2);color:#b01c1c}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{padding:8px 14px;border-radius:99px;font-weight:600;font-size:14px;background:var(--card);border:1px solid var(--line)}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:650;padding:10px 12px;border-bottom:1px solid var(--line);background:#fafbfc}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#f8fafc}
.tbl th.num{text-align:right}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:16px 18px}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:24px;font-weight:780;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sec-t{font-size:15px;font-weight:720;margin:0 0 10px}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px;gap:10px}
.list-row:last-child{border-bottom:0}

/* ---------- login / pin ---------- */
.center{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1200px 600px at 20% 0%,#1d2a48 0%,var(--nav) 55%)}
.login{width:100%;max-width:420px;padding:28px}
.login h2{font-size:22px;margin-bottom:4px}
.logo-big{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.logo-big svg{width:46px;height:46px}
.logo-big b{font-size:19px;letter-spacing:.06em}
.ulist{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-top:14px}
.ubtn{padding:16px 10px;border:1px solid var(--line);border-radius:14px;background:#fff;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:650;font-size:14px}
.ubtn:hover{border-color:var(--accent)}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:17px}
.pindots{display:flex;justify-content:center;gap:14px;margin:18px 0}
.pindots i{width:15px;height:15px;border-radius:50%;border:2px solid #b8c1d1}
.pindots i.f{background:var(--ink);border-color:var(--ink)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pinpad button{height:62px;border-radius:14px;background:var(--bg);font-size:22px;font-weight:650}
.pinpad button:active{background:#e2e6ee}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ---------- salon ---------- */
.salon-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-left:auto;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:4px;display:inline-block}
.plano{position:relative;height:600px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);background-image:radial-gradient(#e5e9f0 1px,transparent 1px);background-size:22px 22px;overflow:hidden}
.plano.edit{outline:2px dashed var(--accent);outline-offset:3px}
.mesa{position:absolute;width:118px;height:96px;border-radius:16px;background:#fff;border:2px solid #cfe9d8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;box-shadow:0 2px 6px rgba(15,23,42,.07);user-select:none;touch-action:none;transition:box-shadow .15s}
.mesa:hover{box-shadow:0 6px 18px rgba(15,23,42,.13)}
.mesa.redonda{border-radius:50%;width:104px;height:104px}
.mesa .mn{font-weight:800;font-size:17px}
.mesa .mt{font-weight:750;font-size:13.5px;font-variant-numeric:tabular-nums}
.mesa .ms{font-size:11.5px;color:var(--muted)}
.mesa.libre{border-color:#bfe5cc}
.mesa.libre .mn{color:#15803d}
.mesa.ocupada{background:var(--warn2);border-color:#f3c46e}
.mesa.precuenta{background:var(--info2);border-color:#8fb6f3}
.mesa .dot{position:absolute;top:7px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--bad)}
.plano.edit .mesa{cursor:grab}
.plano.edit .mesa:active{cursor:grabbing}
.plano.grid{height:auto;min-height:0;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;background-image:none}
.plano.grid .mesa,.plano.grid .mesa.redonda{position:relative!important;left:auto!important;top:auto!important;width:auto;height:86px;border-radius:14px}
.plano.grid .mesa .mn{font-size:20px}
.opgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
@media (max-width:760px){
  .plano{height:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px;background-image:none}
  .mesa,.mesa.redonda{position:relative!important;left:auto!important;top:auto!important;width:auto;height:92px;border-radius:14px}
}

/* ---------- pedido ---------- */
.pv{display:grid;grid-template-columns:minmax(0,1fr) 400px;flex:1;min-height:0}
.pv-left{padding:16px 18px;overflow:auto;min-height:0}
.pv-right{background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:12px 0}
.cats button{padding:9px 15px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:650;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:7px}
.cats button i{width:9px;height:9px;border-radius:50%}
.cats button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 12px 11px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:88px;border-top:4px solid var(--c,#cbd5e1);transition:transform .08s}
.prod:active{transform:scale(.97)}
.prod b{font-size:14.5px;font-weight:680;line-height:1.25}
.prod span{font-size:14px;color:var(--ink2);font-weight:650;margin-top:auto;font-variant-numeric:tabular-nums}
.prod{position:relative}
.prod .pq{position:absolute;bottom:10px;right:10px;background:var(--warn);color:#fff;border-radius:99px;font-style:normal;font-size:12px;font-weight:800;min-width:22px;height:22px;line-height:22px;text-align:center;padding:0 6px}
.prod .ag{font-style:normal;font-size:11px;font-weight:750;color:#b01c1c;background:var(--bad2);border-radius:6px;padding:2px 6px;align-self:flex-start}
.prod .ag.low{color:#9a5b00;background:var(--warn2)}
.stk{font-weight:750;font-variant-numeric:tabular-nums}
.stk.bad{color:var(--bad)}.stk.warn{color:#b26a00}
.imp-prev{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}
.imp-prev .tbl td,.imp-prev .tbl th{padding:7px 10px;font-size:13px}
.vcaja{border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:2px}
.vcaja.ok{background:var(--ok2);color:#0f5f2c;flex-direction:row;justify-content:space-between;align-items:center}
.vcaja.bad{background:var(--bad2);color:#8f1b1b}
.medbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.medbtns .btn{min-height:50px}
.lnk{color:var(--accent);font-weight:650;font-size:12.5px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chips button{padding:7px 11px;border-radius:99px;background:var(--bg);font-size:13px;font-weight:600}
.chips button:hover{background:var(--accent2);color:var(--accent)}
.opt{display:flex;width:100%;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--line);font-weight:620;text-align:left}
.opt:last-child{border-bottom:0}
.opt.bad{color:var(--bad)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:10px;border:3px solid transparent}
.swatches button.on{border-color:var(--ink)}
.acct-h{padding:14px 18px;border-bottom:1px solid var(--line)}
.acct-items{flex:1;overflow:auto;padding:6px 18px}
.it{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.it .c{min-width:28px;font-weight:800;color:var(--ink2)}
.it .n{flex:1;min-width:0}
.it .n b{font-weight:620;font-size:14.5px}
.it .n .nt{font-size:12.5px;color:var(--warn);font-weight:600}
.it .n .x{font-size:12px;color:var(--muted)}
.it .p{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.it.anulado .n b,.it.anulado .p,.it.anulado .c{text-decoration:line-through;color:#a0a9b8}
.it .rm{color:var(--muted);padding:2px 6px;border-radius:7px;font-size:16px;line-height:1}
.it .rm:hover{background:var(--bad2);color:var(--bad)}
.draft{background:#fffaf0;border:1px dashed #f0c674;border-radius:12px;padding:4px 12px;margin:8px 0}
.draft .ttl{font-size:12px;font-weight:750;color:#9a5b00;text-transform:uppercase;letter-spacing:.05em;padding:8px 0 2px}
.draft .it{border-bottom-color:#f5e3bd}
.draft .it:last-child{border-bottom:0}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:30px;height:30px;border-radius:8px;background:#fff;border:1px solid var(--line);font-weight:800;font-size:16px}
.qty span{min-width:22px;text-align:center;font-weight:750}
.acct-f{border-top:1px solid var(--line);padding:14px 18px 16px;display:flex;flex-direction:column;gap:10px;background:#fbfcfd}
.tot{display:flex;justify-content:space-between;font-size:14px;color:var(--ink2)}
.tot.big{font-size:21px;font-weight:800;color:var(--ink)}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mtabs{display:none}
@media (max-width:900px){
  .pv{grid-template-columns:1fr}
  .pv-right{border-left:0}
  .pv.show-acct .pv-left{display:none}
  .pv:not(.show-acct) .pv-right{display:none}
  .mtabs{display:flex;gap:6px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
  .mtabs button{flex:1;padding:10px;border-radius:10px;font-weight:700;background:var(--bg)}
  .mtabs button.on{background:var(--ink);color:#fff}
}

.split{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}

/* ---------- pedidos / cocina ---------- */
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.oc{padding:14px 16px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.oc:hover{border-color:#c9d0dc}
.oc h3{font-size:16px}
.kds{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;align-items:start}
.kc{overflow:hidden}
.kc .kh{padding:11px 14px;display:flex;justify-content:space-between;align-items:center;color:#fff;background:#334155}
.kc.pendiente .kh{background:#475569}
.kc.preparando .kh{background:var(--warn)}
.kc.tarde .kh{background:var(--bad)}
.kc.anul .kh{background:#7f1d1d}
.kc .kh b{font-size:17px}
.kc ul{list-style:none;padding:8px 14px}
.kc li{padding:7px 0;border-bottom:1px dashed var(--line);font-size:15.5px}
.kc li:last-child{border-bottom:0}
.kc li b{font-size:17px;margin-right:6px}
.kc li .nt{display:block;font-size:13px;color:var(--bad);font-weight:650}
.kc .kf{padding:10px 14px 14px;display:flex;gap:8px}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(10,15,28,.45)}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:18px;width:100%;max-width:460px;max-height:calc(100dvh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .16s ease-out}
.mbox.wide{max-width:640px}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.mh{padding:18px 20px 6px;display:flex;align-items:center;justify-content:space-between}
.mh h3{font-size:18px}
.mb{padding:10px 20px}
.mf{padding:12px 20px 18px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.xbtn{width:34px;height:34px;border-radius:9px;font-size:20px;color:var(--muted)}
.xbtn:hover{background:var(--bg)}
.seg{display:flex;background:var(--bg);border-radius:11px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px;border-radius:8px;font-weight:650;font-size:14px}
.seg button.on{background:#fff;box-shadow:var(--sh)}
.medios{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.medios button{padding:10px 14px;border-radius:11px;border:1px solid var(--line);font-weight:650;background:#fff}
.medios button:hover{border-color:var(--accent);color:var(--accent)}
.payrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.payrow .pm{flex:1;font-weight:650}
.payrow input{width:150px;text-align:right}
.paysum{border-radius:12px;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between}
.paysum.falta{background:var(--bad2);color:#b01c1c}
.paysum.okk{background:var(--ok2);color:#0f7a37}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:46px;height:46px;border-radius:12px;background:var(--bg);font-size:22px;font-weight:700}
.stepper b{font-size:24px;min-width:36px;text-align:center}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:pop .2s}
#toast div.err{background:var(--bad)}
#toast div.ok{background:#0f7a37}

/* ---------- mobile nav ---------- */
@media (max-width:760px){
  #app{flex-direction:column-reverse}
  .nav{width:100%;height:66px;flex-direction:row;justify-content:space-around;padding:4px 2px;gap:0;overflow-x:auto;overflow-y:hidden}
  .brand,.nav .sp{display:none}
  .nav .nb{width:auto;min-width:58px;flex:1;padding:7px 2px 5px;font-size:10.5px}
  .top{padding:11px 14px}
  .top h1{font-size:18px}
  .wrap{padding:14px 14px 30px}
  .grid2,.grid3{grid-template-columns:1fr}

    get isAnon() { return mode === 'local' ? !!simUid : !!(authUser && authUser.isAnonymous); },
    get isOwner() { return mode === 'local' ? !simUid : !!(authUser && !authUser.isAnonymous && authUser.uid === nid); },
    setAuth(u) { authUser = u; },
    simKiosk(id) { simUid = id; },
    signInAnon() { return A.signInAnonymously(auth); },
    async init() {
      if (!FIREBASE_CONFIG) { mode = 'local'; loadLocal(); nid = 'demo'; return; }
      mode = 'firebase';
      const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
      const [appM, authM, fsM] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
      const app = appM.initializeApp(FIREBASE_CONFIG);
      A = authM; F = fsM; auth = A.getAuth(app);
      try { fdb = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
      catch (e) { fdb = F.getFirestore(app); }
    },
    onAuth(cb) { if (mode === 'local') { cb({ uid: 'demo' }); return; } A.onAuthStateChanged(auth, cb); },
    login(email, pass) { return A.signInWithEmailAndPassword(auth, email, pass); },
    logout() { if (mode === 'firebase') return A.signOut(auth); },
    setNegocio(id) { nid = id; },
    newId(col) { return mode === 'local' ? uid() : F.doc(cref(col)).id; },
    sub(col, filters, cb) {
      if (mode === 'local') {
        const l = { col, fire: () => cb(localList(col, filters)) };
        listeners.add(l); l.fire(); return () => listeners.delete(l);
      }
      let q = cref(col);
      if (filters && filters.length) q = F.query(q, ...filters.map(([f, op, v]) => F.where(f, op, v)));
      return F.onSnapshot(q, s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), err => { console.error(col, err); toast('Error de conexión (' + col + '): ' + err.code, 'err'); });
    },
    subDoc(col, id, cb, onErr) {
      if (mode === 'local') {
        const l = { col, fire: () => { const d = (store[col] || {})[id]; cb(d ? { id, ...d } : null); } };
        listeners.add(l); l.fire(); return () => listeners.delete(l);
      }
      return F.onSnapshot(ref(col, id), s => cb(s.exists() ? { id: s.id, ...s.data() } : null), err => { console.error(col, err); if (onErr) onErr(err); });
    },
    async query(col, filters) {
      if (mode === 'local') return localList(col, filters);
      let q = cref(col);
      if (filters && filters.length) q = F.query(q, ...filters.map(([f, op, v]) => F.where(f, op, v)));
      const s = await F.getDocs(q); return s.docs.map(d => ({ id: d.id, ...d.data() }));
    },
    async get(col, id) {
      if (mode === 'local') { const d = (store[col] || {})[id]; return d ? { id, ...d } : null; }
      const s = await F.getDoc(ref(col, id)); return s.exists() ? { id: s.id, ...s.data() } : null;
    },
    set(col, id, data, merge = true) {
      if (mode === 'local') {
        store[col] = store[col] || {};
        store[col][id] = merge ? { ...(store[col][id] || {}), ...data } : { ...data };
        saveLocal(); notify(col); return;
      }
      F.setDoc(ref(col, id), data, { merge }).catch(fail(col));
    },
    add(col, data) { const id = this.newId(col); this.set(col, id, data, false); return id; },
    /* versiones que esperan la respuesta del servidor (para validar contraseñas con las reglas) */
    setAsync(col, id, data, merge = true) {
      if (mode === 'local') { this.set(col, id, data, merge); return Promise.resolve(); }
      return F.setDoc(ref(col, id), data, { merge });
    },
    delAsync(col, id) {
      if (mode === 'local') { this.del(col, id); return Promise.resolve(); }
      return F.deleteDoc(ref(col, id));
    },
    unsetAsync(col, id, field) {
      if (mode === 'local') { const d = (store[col] || {})[id]; if (d) { delete d[field]; saveLocal(); notify(col); } return Promise.resolve(); }
      return F.updateDoc(ref(col, id), { [field]: F.deleteField() });
    },
    update(col, id, patch) {
      if (mode === 'local') {
        if (!(store[col] || {})[id]) return;
        store[col][id] = { ...store[col][id], ...patch }; saveLocal(); notify(col); return;
      }
      F.updateDoc(ref(col, id), patch).catch(fail(col));
    },
    /* agrega elementos a un arreglo de forma atómica (funciona sin internet) */
    append(col, id, field, items, patch = {}) {
      if (mode === 'local') {
        const d = (store[col] || {})[id]; if (!d) return;
        store[col][id] = { ...d, ...patch, [field]: [...(d[field] || []), ...items] }; saveLocal(); notify(col); return;
      }
      F.updateDoc(ref(col, id), { ...patch, [field]: F.arrayUnion(...items) }).catch(fail(col));
    },
    /* modifica un documento leyendo su versión más reciente (transacción si hay internet) */
    mutate(col, id, fn, cached) {
      if (mode === 'local') {
        const d = (store[col] || {})[id]; if (!d) return;
        const patch = fn({ id, ...d }); if (patch) { store[col][id] = { ...d, ...patch }; saveLocal(); notify(col); } return;
      }
      F.runTransaction(fdb, async tx => {
        const s = await tx.get(ref(col, id)); if (!s.exists()) return;
        const patch = fn({ id: s.id, ...s.data() }); if (patch) tx.update(ref(col, id), patch);
      }).catch(err => {
        console.warn('transacción falló, guardando directo', err);
        if (cached) { const patch = fn(cached); if (patch) F.updateDoc(ref(col, id), patch).catch(fail(col)); }
      });
    },
    /* suma o resta a un número de forma atómica (stock) */
    inc(col, id, field, n) {
      if (mode === 'local') {
        const d = (store[col] || {})[id]; if (!d) return;
        store[col][id] = { ...d, [field]: (Number(d[field]) || 0) + n }; saveLocal(); notify(col); return;
      }
      F.updateDoc(ref(col, id), { [field]: F.increment(n) }).catch(fail(col));
    },
    del(col, id) {
      if (mode === 'local') { if (store[col]) { delete store[col][id]; saveLocal(); notify(col); } return; }
      F.deleteDoc(ref(col, id)).catch(fail(col));
    },
    async seed(data, rootData) {
      if (mode === 'local') {
        for (const [col, docs] of Object.entries(data)) { store[col] = { ...(store[col] || {}), ...docs }; }
        store.__root = rootData; saveLocal(); return;
      }
      const b = F.writeBatch(fdb);
      b.set(F.doc(fdb, 'negocios', nid), rootData);
      for (const [col, docs] of Object.entries(data)) for (const [id, d] of Object.entries(docs)) b.set(ref(col, id), d);
      await b.commit();
    },
    async hasNegocio() {
      if (mode === 'local') return !!store.__root;
      const s = await F.getDoc(F.doc(fdb, 'negocios', nid)); return s.exists();
    },
    /* ---- colecciones raíz: licencias y panel NEXORA ---- */
    localHas(col) { return !!store['R:' + col]; },
    rsubDoc(path, cb) {
      const p = path.split('/'); const id = p.pop(); const col = p.join('/');
      if (mode === 'local') {
        const key = 'R:' + col;
        const l = { col: key, fire: () => { const d = (store[key] || {})[id]; cb(d ? { id, ...d } : null); } };
        listeners.add(l); l.fire(); return () => listeners.delete(l);
      }
      return F.onSnapshot(F.doc(fdb, path), s => {
        if (!s.exists()) { cb(s.metadata.fromCache ? { error: 'offline' } : null); return; }
        cb({ id: s.id, ...s.data() });
      }, err => { console.error(path, err); cb({ error: err.code || 'error' }); });
    },
    rsub(col, cb, onErr) {
      if (mode === 'local') {
        const key = 'R:' + col;
        const l = { col: key, fire: () => cb(Object.entries(store[key] || {}).map(([id, d]) => ({ id, ...d }))) };
        listeners.add(l); l.fire(); return () => listeners.delete(l);
      }
      return F.onSnapshot(F.collection(fdb, col), s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), err => { console.error(col, err); if (onErr) onErr(err); });
    },
    async rquery(col) {
      if (mode === 'local') return Object.entries(store['R:' + col] || {}).map(([id, d]) => ({ id, ...d }));
      const s = await F.getDocs(F.collection(fdb, col)); return s.docs.map(d => ({ id: d.id, ...d.data() }));
    },
    async rget(path) {
      if (mode === 'local') { const p = path.split('/'); const id = p.pop(); const d = (store['R:' + p.join('/')] || {})[id]; return d ? { id, ...d } : null; }
      const s = await F.getDoc(F.doc(fdb, path)); return s.exists() ? { id: s.id, ...s.data() } : null;
    },
    rset(path, data, merge = true) {
      if (mode === 'local') {
        const p = path.split('/'); const id = p.pop(); const key = 'R:' + p.join('/');
        store[key] = store[key] || {}; store[key][id] = merge ? { ...(store[key][id] || {}), ...data } : { ...data };
        saveLocal(); notify(key); return Promise.resolve();
      }
      return F.setDoc(F.doc(fdb, path), data, { merge }).catch(e => { fail(path)(e); });
    },
    rdelField(path, field) {
      if (mode === 'local') {
        const p = path.split('/'); const id = p.pop(); const key = 'R:' + p.join('/');
        if ((store[key] || {})[id]) { delete store[key][id][field]; saveLocal(); notify(key); } return Promise.resolve();
      }
      return F.updateDoc(F.doc(fdb, path), { [field]: F.deleteField() }).catch(e => console.warn(path, e));
    },
    rnewId(col) { return mode === 'local' ? uid() : F.doc(F.collection(fdb, col)).id; },
    /* borra todos los datos del negocio (para reiniciar un demo) */
    async wipe(cols) {
      if (mode === 'local') { cols.forEach(c => delete store[c]); delete store.__root; saveLocal(); return; }
      for (const c of cols) {
        const snap = await F.getDocs(cref(c));
        for (let i = 0; i < snap.docs.length; i += 400) { const b = F.writeBatch(fdb); snap.docs.slice(i, i + 400).forEach(d => b.delete(d.ref)); await b.commit(); }
      }
      await F.deleteDoc(F.doc(fdb, 'negocios', nid));
    },
    resetDemo() { localStorage.removeItem(LKEY); localStorage.removeItem('nexorapos_session'); location.reload(); },
  };
})();

/* tipo: 'bar' (ejemplo con los productos de AC Boutique), 'restaurante' o 'vacio' */
async function buildSeed(nombre, adminPin, usuariosEjemplo, tipo = 'bar') {
  const salt = DB.nid;
  const mesas = {}, salas = {}, categorias = {}, productos = {};
  const cfg = { nombre, nit: '', direccion: '', telefono: '', pie: '¡Gracias por su visita!', ticketAncho: 80, imprimirComanda: false, propinaPct: 10, impuestoNombre: 'Impoconsumo', impuestoPct: 8, mostrarImpuesto: true, medios: ['Efectivo', 'Tarjeta', 'Nequi', 'Daviplata', 'Transferencia'], permisos: DEFAULT_PERMS, nombreCocina: 'Cocina' };
  const addMesa = (id, n, sala, k, forma = 'cuadrada') => { mesas[id] = { nombre: String(n), salaId: sala, x: 4 + (k % 6) * 15.5, y: 5 + (Math.floor(k / 6) % 5) * 19, forma, orden: parseInt(n, 10) || k + 1 }; };
  if (tipo !== 'bar') { cfg.modPedidos = true; cfg.modCocina = true; }
  if (tipo === 'bar') {
    cfg.nombreCocina = 'Barra';
    salas.s1 = { nombre: 'Salón', orden: 1, vista: 'cuadricula' };
    salas.s2 = { nombre: 'Terraza', orden: 2, vista: 'cuadricula' };
    let k = 0;
    for (let n = 1; n <= 12; n++) addMesa('m' + n, n, 's1', k++);
    for (let n = 21; n <= 80; n++) addMesa('m' + n, n, 's1', k++);
    for (let n = 13; n <= 20; n++) addMesa('m' + n, n, 's2', n - 13);
    const cats = {}; let co = 0;
    const CC = { 'Cervezas / Sodas': '#e03131', 'Botellas': '#d6336c', 'Micheladas': '#ae3ec9' };
    BAR_EJEMPLO.forEach((p, i) => {
      if (!cats[p.cat]) { cats[p.cat] = 'c' + (++co); categorias[cats[p.cat]] = { nombre: p.cat, color: CC[p.cat] || COLORS[co % COLORS.length], orden: co }; }
      const d = { nombre: p.nombre, categoriaId: cats[p.cat], precio: p.precio, costo: p.costo || 0, cocina: !!p.comanda, activo: true, orden: i + 1, controlStock: p.stock != null, stockMin: p.min || 0 };
      if (p.stock != null) d.stock = p.stock;
      if (p.opciones && p.opciones.length) d.opciones = p.opciones;
      if (p.porCaja) d.porCaja = p.porCaja;
      productos['p' + (i + 1)] = d;
    });
  } else {
    salas.s1 = { nombre: 'Salón principal', orden: 1 }; salas.s2 = { nombre: 'Terraza', orden: 2 };
    for (let i = 0; i < 8; i++) mesas['m' + (i + 1)] = { nombre: String(i + 1), salaId: 's1', x: 6 + (i % 4) * 23, y: 8 + Math.floor(i / 4) * 44, forma: i % 4 === 3 ? 'redonda' : 'cuadrada', orden: i + 1 };
    for (let i = 0; i < 4; i++) mesas['t' + (i + 1)] = { nombre: 'T' + (i + 1), salaId: 's2', x: 8 + i * 22, y: 30, forma: 'redonda', orden: i + 1 };
    if (tipo === 'restaurante') {
      const cats = { c1: ['Entradas', '#f59f00', 1], c2: ['Platos fuertes', '#e8590c', 2], c3: ['Comidas rápidas', '#d6336c', 3], c4: ['Bebidas', '#1098ad', 4], c5: ['Postres', '#ae3ec9', 5] };
      for (const [id, [n, c, o]] of Object.entries(cats)) categorias[id] = { nombre: n, color: c, orden: o };
      const P = [
        ['Patacones con hogao', 'c1', 12000], ['Empanadas x3', 'c1', 9000], ['Arepa de huevo', 'c1', 6000],
        ['Bandeja paisa', 'c2', 32000], ['Pechuga a la plancha', 'c2', 26000], ['Mojarra frita', 'c2', 35000], ['Churrasco', 'c2', 38000],
        ['Hamburguesa sencilla', 'c3', 18000], ['Hamburguesa doble', 'c3', 24000], ['Salchipapa', 'c3', 16000], ['Perro caliente', 'c3', 14000],
        ['Gaseosa 400 ml', 'c4', 4500, false], ['Jugo natural', 'c4', 7000], ['Limonada de coco', 'c4', 9000], ['Agua', 'c4', 3500, false], ['Cerveza', 'c4', 6000, false],
        ['Brownie con helado', 'c5', 11000], ['Flan de caramelo', 'c5', 8000],
      ];
      P.forEach(([n, c, p, k], i) => productos['p' + (i + 1)] = { nombre: n, categoriaId: c, precio: p, cocina: k !== false, activo: true, orden: i + 1 });
    }
  }
  const usuarios = { u_admin: { nombre: 'Administrador', rol: 'admin', pin: await hashPin(adminPin, salt), activo: true, orden: 1 } };
  if (usuariosEjemplo) {
    usuarios.u_caja = { nombre: 'Laura', rol: 'cajero', pin: await hashPin('1111', salt), activo: true, orden: 2 };
    usuarios.u_mes1 = { nombre: 'Carlos', rol: 'mesero', pin: await hashPin('2222', salt), activo: true, orden: 3 };
    usuarios.u_mes2 = { nombre: 'Andrea', rol: 'mesero', pin: await hashPin('2222', salt), activo: true, orden: 4 };
    if (cfg.modCocina) usuarios.u_coc = { nombre: cfg.nombreCocina, rol: 'cocina', pin: await hashPin('3333', salt), activo: true, orden: 5 };
  }
  /* las contraseñas van aparte (colección "pines"), que nadie puede leer desde los equipos */
  const pines = {};
  for (const [id, u] of Object.entries(usuarios)) { pines[id] = { pin: u.pin }; delete u.pin; }
  const acceso = { nombre, usuarios: {} };
  for (const [id, u] of Object.entries(usuarios)) acceso.usuarios[claveUsuario(u.nombre)] = { id, nombre: u.nombre, rol: u.rol };
  return { data: { config: { general: cfg }, salas, mesas, categorias, productos, usuarios, pines, publico: { acceso } }, root: { nombre, creado: now(), tipo } };
}

/* total de una venta (precios con impuesto incluido) */
function calc(v, extra = []) {
  const items = [...(v.items || []).filter(i => i.estado !== 'anulado'), ...extra];
  const subtotal = sum(items, i => i.precio * i.cant);
  let desc = 0;
  if (v.descuento) desc = v.descuento.tipo === 'pct' ? Math.round(subtotal * v.descuento.valor / 100) : Math.min(subtotal, v.descuento.valor || 0);
  const neto = subtotal - desc;
  const envio = v.tipo === 'domicilio' ? (v.envio || 0) : 0;
  const pct = Number(S.cfg.propinaPct) || 0;
  const propSug = Math.round(neto * pct / 100 / 100) * 100;
  const impPct = Number(S.cfg.impuestoPct) || 0;
  const base = Math.round(neto / (1 + impPct / 100));
  return { items, subtotal, desc, neto, envio, propSug, base, imp: neto - base, total: neto + envio };
}

async function boot() {
  render();
  try { await DB.init(); }
  catch (e) { console.error(e); S.screen = 'fatal'; S.fatal = 'No se pudo cargar Firebase. Revisa la conexión a internet y la configuración.'; render(); return; }
  if (DB.mode === 'local') ensureLicDemo();
  // demo local del modo "solo link" (para pruebas): ?kiosk=1
  if (DB.mode === 'local' && new URLSearchParams(location.search).get('kiosk')) { let sid = sessionStorage.getItem('nexorapos_sim'); if (!sid) { sid = 'equipo-' + uid(); sessionStorage.setItem('nexorapos_sim', sid); } DB.simKiosk(sid); kioskBoot(); return; }
  const linkNid = DB.mode === 'firebase' && LINK_NEG ? await resolverLink() : null;
  if (DB.mode === 'firebase' && LINK_NEG && !linkNid) { S.screen = 'fatal'; S.fatal = 'Este link no es válido. Pídele a NEXORA el link correcto del negocio.'; render(); return; }
  DB.onAuth(async user => {
    stopSubs(); if (LICUNSUB) { LICUNSUB(); LICUNSUB = null; }
    if (ACCUNSUB) { ACCUNSUB(); ACCUNSUB = null; }
    DB.setAuth(user || null);
    if (linkNid) {
      // equipo abierto con el link: entra sin correo (cuenta anónima del equipo)
      if (!user) {
        S.screen = 'loading'; render();
        try { await DB.signInAnon(); }
        catch (e) { console.error(e); S.screen = 'fatal'; S.fatal = 'No se pudo conectar (' + (e.code || e.message) + '). Si dice "operation-not-allowed", activa el acceso Anónimo en Firebase → Authentication → Método de acceso.'; render(); }
        return;
      }
      if (!user.isAnonymous && user.uid !== linkNid) { S.screen = 'fatal'; S.fatal = 'Este navegador tiene abierta otra cuenta (por ejemplo el panel de NEXORA). Abre el link del negocio en otro navegador o en una ventana de incógnito.'; render(); return; }
      if (user.isAnonymous) { DB.setNegocio(linkNid); kioskBoot(); return; }
    } else if (user && user.isAnonymous) { await DB.logout(); return; }
    if (!user) { S.user = null; S.screen = 'login'; render(); return; }
    DB.setNegocio(user.uid);
    S.authEmail = user.email || '';
    S.lic = undefined; S.licPagos = null;
    LICUNSUB = DB.rsubDoc('licencias/' + user.uid, l => {
      const first = S.lic === undefined; S.lic = l;
      if (first || (S.screen === 'bloqueo' && !licState().bloqueado)) { afterLic(); return; }
      render();
    });
  });
}

  try {

    [0, 0.22].forEach(t => {

const OCULTAR_FUDO = ["Buchanan's Master Litro", 'Old Parr Litro', 'JP'];
const NUEVOS_FUDO = [['DESCORCHE #1', 20000], ['DESCORCHE #2', 30000], ['DESCORCHE #3', 50000]];
let MIG_FUDO = false;
function corregirComoFudo() {
  if (MIG_FUDO || !puedeAdministrar() || !S.cfg || !S.cfg.permisos || !S.productos.length || !S.categorias.length) return;
  if (DB.mode === 'local' && !/[?&]migfudo=1/.test(location.search)) return; // en la demo solo para pruebas
  MIG_FUDO = true; if (S.cfg.correccionFudoV1) return;
  const tabla = {}; Object.entries(CORRECCION_FUDO).forEach(([k, v]) => tabla[norm(k)] = v);
  const ocultar = new Set(OCULTAR_FUDO.map(norm));
  let n = 0;
  S.productos.forEach(p => {
    const k = norm(p.nombre), c = tabla[k];
    if (c) { const d = { nombre: c[0] }; if (c[1]) d.precio = c[1]; DB.update('productos', p.id, d); n++; }
    else if (ocultar.has(k) && p.activo !== false) { DB.update('productos', p.id, { activo: false }); n++; }
  });
  const cat = S.categorias.find(c => norm(c.nombre) === 'botellas');
  if (cat) {
    const maxOrden = Math.max(0, ...S.productos.map(p => Number(p.orden) || 0));
    NUEVOS_FUDO.forEach(([nombre, precio], i) => {
      if (S.productos.some(p => norm(p.nombre) === norm(nombre))) return;
      DB.add('productos', { nombre, categoriaId: cat.id, precio, costo: 0, cocina: true, activo: true, controlStock: false, stockMin: 0, orden: maxOrden + i + 1 }); n++;
    });
  }
  DB.update('config', 'general', { correccionFudoV1: true });
  if (n && S.user) logAct('productos', `Nombres y precios actualizados como en Fudo (${n} productos)`);
}

let MIG_PC = false;
function migrarPorCaja() {
  if (MIG_PC || !S.user || S.user.rol !== 'admin' || !S.cfg || !S.productos || !S.productos.length) return;
  MIG_PC = true; if (S.cfg.porCajaV1) return;
  const tabla = {}; (typeof BAR_EJEMPLO !== 'undefined' ? BAR_EJEMPLO : []).forEach(p => { if (p.porCaja) tabla[norm(p.nombre)] = p.porCaja; });
  S.productos.forEach(p => { const c = tabla[norm(p.nombre)]; if (c && !(parseInt(p.porCaja, 10) > 0)) DB.update('productos', p.id, { porCaja: c }); });
  DB.update('config', 'general', { porCajaV1: true });
}

A.pinLogin = async () => {
  if (lockLeft()) { render(); setTimeout(render, lockLeft() * 1000 + 50); return; }
  const name = $('#pl_u').value.replace(/\s+/g, ' ').trim(), pin = $('#pl_p').value.trim();
  if (!name || !/^\d{4}$/.test(pin)) { S.pinErr = 'Escribe tu usuario y tu contraseña de 4 números'; render(); return; }
  const h = await hashPin(pin, DB.nid), key = claveUsuario(name);
  let entry = null;
  if (S.kiosk) entry = ((S.acceso || {}).usuarios || {})[key] || null;
  else { const x = S.usuarios.find(x => x.activo && claveUsuario(x.nombre) === key); if (x) entry = { id: x.id, nombre: x.nombre, rol: x.rol }; }
  if (!entry && key === 'mantenimiento') entry = { id: MANT_ID, nombre: 'Mantenimiento', rol: 'admin' };
  $('#pl_p').value = '';
  let ok = false;
  if (entry) {
    S.pinErr = 'Verificando…'; render();
    try { ok = await crearSesion(entry, h); }
    catch (e) { console.error(e); S.pinErr = e && e.code === 'timeout' ? 'Sin conexión a internet. Revisa el wifi e intenta de nuevo.' : 'No se pudo entrar (' + ((e && (e.code || e.message)) || 'error') + ')'; render(); return; }
  }
  const u = !ok ? null : entry.id === MANT_ID ? mantUser() : (S.usuarios.find(x => x.id === entry.id) || { ...entry, activo: true });
  if (!ok) {
    S.pinFails = (S.pinFails || 0) + 1;
    if (S.pinFails >= 5) { localStorage.setItem('nexorapos_lock', String(Date.now() + 60000)); S.pinFails = 0; setTimeout(render, 60050); }
    S.pinErr = 'Usuario o contraseña incorrectos'; render(); return;
  }
  S.pinFails = 0; S.pinErr = '';
  if (!u.mant) localStorage.setItem('nexorapos_lastuser', u.nombre);
  localStorage.setItem(SESS_KEY(), JSON.stringify({ nid: DB.nid, userId: u.id }));
  S.user = u; S.editPlano = false;
  if (S.kiosk) { kioskEntrar(); logAct('sesion', 'Inició sesión'); return; }

};

  if (k === 'pedido') return perm('salon') || (perm('pedidos') && modOn('pedidos'));

function bindPlano() {
  const pl = $('#plano'); if (!pl) return;
  $$('.mesa', pl).forEach(el => {
    el.addEventListener('pointerdown', e => {
      if (window.innerWidth <= 760) return;
      const rect = pl.getBoundingClientRect();
      const sx = e.clientX, sy = e.clientY, ox = el.offsetLeft, oy = el.offsetTop;
      let moved = false; S.dragging = true;
      try { el.setPointerCapture(e.pointerId); } catch (_) { }
      const mv = ev => {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (!moved && Math.hypot(dx, dy) < 5) return; moved = true;
        const nx = Math.min(Math.max(0, ox + dx), rect.width - el.offsetWidth), ny = Math.min(Math.max(0, oy + dy), rect.height - el.offsetHeight);
        el.style.left = (nx / rect.width * 100).toFixed(1) + '%'; el.style.top = (ny / rect.height * 100).toFixed(1) + '%';
      };
      const up = () => {
        el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
        S.dragging = false;
        if (moved) { suppressClick = true; setTimeout(() => suppressClick = false, 60); DB.update('mesas', el.dataset.id, { x: parseFloat(el.style.left), y: parseFloat(el.style.top) }); }
      };
      el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    });
  });
}

function agregarDraft(v, p, op) {

/* inventario: mueve el stock de los productos que lo controlan */
function moverStock(items, signo, ctx) {
  const porProd = {};
  (items || []).forEach(i => { if (i.estado !== 'anulado') porProd[i.productoId] = (porProd[i.productoId] || 0) + i.cant; });
  Object.entries(porProd).forEach(([pid, n]) => {
    const p = gProd(pid); if (!p || !p.controlStock) return;
    DB.inc('productos', pid, 'stock', signo * n);
    if (ctx && S.user) DB.add('invmov', { productoId: pid, nombre: p.nombre, tipo: 'devolucion', cant: signo * n, costo: Number(p.costo) || 0, nota: ctx.ref + (ctx.motivo ? ' · ' + ctx.motivo : ''), usuario: S.user.nombre, fecha: now() });
  });
}

/* envía lo pendiente: confirma productos y crea la comanda de cocina */
function enviarDraft(v, silent = false) {
  const draft = S.drafts[v.id] || [];
  if (!draft.length) return [];
  const t = now();
  const items = draft.map(i => ({ ...i, id: uid(), estado: 'enviado', enviadoEn: t, por: S.user.nombre }));
  DB.append('ventas', v.id, 'items', items, v.tipo === 'mesa' ? { precuentaEn: null } : {});
  moverStock(items, -1);
  const coc = modOn('cocina') ? items.filter(i => i.cocina) : [];
  if (coc.length) {
    DB.add('comandas', { ventaId: v.id, tipo: v.tipo, titulo: tituloVenta(v), meseroNombre: v.meseroNombre || (v.cliente && v.cliente.nombre) || '', items: coc.map(i => ({ nombre: i.nombre, cant: i.cant, nota: i.nota || '' })), estado: 'pendiente', anulacion: false, creadaEn: t });
    if (S.cfg.imprimirComanda) printComanda(v, coc);
  }
  delete S.drafts[v.id]; saveDrafts();
  logAct('pedido', `Envió ${resumenItems(items)} · ${tituloVenta(v)}`, { ventaId: v.id });
  if (!silent) toast(coc.length ? 'Pedido enviado a ' + (S.cfg.nombreCocina || 'cocina').toLowerCase() : 'Pedido guardado', 'ok');
  return items;
}

  MODAL = { type: 'anular', itemId: i.id, cant: i.cant, max: i.cant };

A.confAnular = () => {
  const motivo = $('#an_m').value.trim(); if (!motivo) return toast('Escribe el motivo', 'err');
  const v = gVenta(S.ventaId); const { itemId, cant } = MODAL;
  const it = (v.items || []).find(x => x.id === itemId);
  const meta = { estado: 'anulado', anuladoMotivo: motivo, anuladoPor: S.user.nombre, anuladoEn: now() };
  DB.mutate('ventas', v.id, d => {
    const items = [];
    (d.items || []).forEach(i => {
      if (i.id !== itemId || i.estado === 'anulado') { items.push(i); return; }
      if (cant >= i.cant) items.push({ ...i, ...meta });
      else { items.push({ ...i, cant: i.cant - cant }); items.push({ ...i, id: uid(), cant, ...meta }); }
    });
    return { items };
  }, v);
  if (it) moverStock([{ ...it, cant: Math.min(cant, it.cant), estado: 'enviado' }], +1, { ref: 'Anulado en ' + tituloVenta(v), motivo });
  if (it) logAct('anulacion', `Anuló ${Math.min(cant, it.cant)} ${it.nombre} de ${tituloVenta(v)}${it.controlStock !== false ? ' (vuelve al inventario)' : ''}`, { motivo, ventaId: v.id, monto: it.precio * Math.min(cant, it.cant) });

/* ===================== cobrar ===================== */
let PAY = null;
/* la caja no es obligatoria: si nadie la abrió, se abre sola (base $0) con el primer cobro.
   Solo se exige abrirla antes si el administrador lo activa en Ajustes → Pagos e impuestos. */
const cajaObligatoria = () => !!S.cfg.cajaObligatoria;
function asegurarCaja() {
  if (S.arqueo) return S.arqueo.id;
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const id = `auto-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; // mismo id si dos celulares cobran a la vez
  const a = { estado: 'abierto', abiertoEn: now(), abiertoPor: S.user.nombre, base: 0, automatica: true };
  DB.set('arqueos', id, a);
  if (!S.arqueo) S.arqueo = { id, ...a };
  logAct('caja', 'La caja se abrió sola con el primer cobro (base $0)');
  return id;
}
A.cobrar = () => {
  const v = gVenta(S.ventaId); if (!v) return;
  if (!canCobrar(v)) return toast('Solo puedes cobrar tus propias mesas', 'err');
  if (!S.arqueo && cajaObligatoria()) {
    MODAL = { type: 'cajaCerrada' };
    openModal(`${mHead('La caja está cerrada')}<div class="mb"><p>Para cobrar primero hay que abrir la caja del turno.</p></div><div class="mf"><button class="btn" data-act="closeModal">Cancelar</button>${perm('caja') ? '<button class="btn pri" data-act="irCaja" data-primary>Ir a Caja</button>' : '<span class="muted small" style="align-self:center">Pide al cajero o al administrador que abra la caja.</span>'}</div>`);
    return;
  }
  const draft = S.drafts[v.id] || [];
  const c = calc(v, draft);
  if (c.total <= 0) return toast('La cuenta está en cero', 'err');
  PAY = { vid: v.id, c, propinaOn: v.tipo === 'mesa' && c.propSug > 0, propina: c.propSug, pagos: [], imprimir: true };
  MODAL = { type: 'pay' };
  openModal(payHTML(v), true);
  payRefresh();
};
A.irCaja = () => { closeModal(); S.view = 'caja'; render(); };
const payTotal = () => PAY.c.total + (PAY.propinaOn ? PAY.propina : 0);
function payHTML(v, titulo) {
  const c = PAY.c;
  return `${mHead(titulo || ('Cobrar · ' + esc(tituloVenta(v))))}<div class="mb">
    <div class="card pad" style="box-shadow:none;margin-bottom:14px">
      <div class="tot"><span>Subtotal</span><span>${money(c.subtotal)}</span></div>
      ${c.desc ? `<div class="tot"><span>Descuento</span><span>− ${money(c.desc)}</span></div>` : ''}
      ${c.envio ? `<div class="tot"><span>Domicilio</span><span>${money(c.envio)}</span></div>` : ''}
      <div class="row between" style="margin:6px 0">
        <label class="chk" style="min-height:30px"><input type="checkbox" id="pay_pon" data-ch="payPropOn" ${PAY.propinaOn ? 'checked' : ''}> Propina voluntaria</label>
        <input class="inp money" id="pay_prop" data-in="payProp" style="width:130px;min-height:36px;text-align:right" value="${num(PAY.propina)}" ${PAY.propinaOn ? '' : 'disabled'}>
      </div>
      <div class="tot big"><span>Total a pagar</span><span id="pay_tot">${money(payTotal())}</span></div>
    </div>
    <label style="font-size:13px;font-weight:650;color:var(--ink2)">Medio de pago</label>
    <div class="medios">${medios().map(m => `<button data-act="payAdd" data-m="${esc(m)}">${esc(m)}</button>`).join('')}</div>
    <div id="pay_rows">${payRowsHTML()}</div>
    <div class="chips" id="pay_bills"></div>
    <div class="paysum" id="pay_stat"></div>
    <label class="chk" style="margin-top:8px"><input type="checkbox" id="pay_pr" ${PAY.imprimir ? 'checked' : ''}> Imprimir comprobante</label>
  </div><div class="mf"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn ok lg" id="pay_ok" data-act="payConfirm" data-primary>Confirmar pago</button></div>`;
}
function payRowsHTML() {
  return PAY.pagos.map((p, i) => `<div class="payrow"><span class="pm">${esc(p.medio)}</span><input class="inp money" id="pay_r${i}" data-in="payRow" data-i="${i}" inputmode="numeric" value="${num(p.monto)}"><button class="xbtn" data-act="payDel" data-i="${i}">×</button></div>`).join('');
}
function payState() {
  const total = payTotal(); const pagado = sum(PAY.pagos, p => p.monto);
  const ef = sum(PAY.pagos.filter(p => p.medio === 'Efectivo'), p => p.monto);
  if (pagado < total) return { ok: false, cls: 'falta', txt: ['Falta', money(total - pagado)] };
  const exc = pagado - total;
  if (exc > 0 && exc > ef) return { ok: false, cls: 'falta', txt: ['Los pagos electrónicos superan el total', money(exc)] };
  return { ok: PAY.pagos.length > 0, cls: 'okk', txt: exc > 0 ? ['Cambio para el cliente', money(exc)] : ['Pago completo', '✓'], cambio: exc };
}
function payRefresh() {
  const st = payState();
  const el = $('#pay_stat'); if (!el) return;
  el.className = 'paysum ' + st.cls; el.innerHTML = `<span>${st.txt[0]}</span><span>${st.txt[1]}</span>`;
  $('#pay_tot').textContent = money(payTotal());
  $('#pay_ok').disabled = !st.ok;
  const bl = $('#pay_bills');
  if (bl) {
    const ef = PAY.pagos.findIndex(p => p.medio === 'Efectivo');
    const resto = payTotal() - sum(PAY.pagos.filter(p => p.medio !== 'Efectivo'), p => p.monto);
    bl.innerHTML = ef < 0 ? '' : `<span class="small muted" style="align-self:center">El cliente paga con:</span>` + [resto, 10000, 20000, 50000, 100000].filter((b, i) => i === 0 || b > resto).filter((b, i, a) => a.indexOf(b) === i).map((b, i) => `<button data-act="payBill" data-v="${b}">${i === 0 ? 'Exacto' : money(b)}</button>`).join('');
  }
}
A.payAdd = el => {
  const rest = Math.max(0, payTotal() - sum(PAY.pagos, p => p.monto));
  const ex = PAY.pagos.find(p => p.medio === el.dataset.m);
  if (ex) ex.monto += rest; else PAY.pagos.push({ medio: el.dataset.m, monto: rest });
  $('#pay_rows').innerHTML = payRowsHTML(); payRefresh();
  const idx = PAY.pagos.findIndex(p => p.medio === el.dataset.m);
  const inp = $('#pay_r' + idx); if (inp) { inp.focus(); inp.select(); }
};
A.payBill = el => {
  const ef = PAY.pagos.find(p => p.medio === 'Efectivo'); if (!ef) return;
  ef.monto = +el.dataset.v; $('#pay_rows').innerHTML = payRowsHTML(); payRefresh();
};
A.payDel = el => { PAY.pagos.splice(+el.dataset.i, 1); $('#pay_rows').innerHTML = payRowsHTML(); payRefresh(); };
A.payConfirm = () => {
  const st = payState(); if (!st.ok) return;
  if (PAY.cart) { vFinalizar(st); return; }
  const v = gVenta(PAY.vid); if (!v) return;
  const nuevos = enviarDraft(v, true);
  const cambio = st.cambio || 0;
  const pagos = PAY.pagos.map(p => ({ ...p }));
  if (cambio > 0) { const ef = pagos.find(p => p.medio === 'Efectivo'); ef.recibido = ef.monto; ef.monto -= cambio; }
  const propina = PAY.propinaOn ? PAY.propina : 0;
  const c = PAY.c;
  const patch = {
    estado: 'cerrada', cerradaEn: now(), cerradaPor: S.user.nombre, pagos: pagos.filter(p => p.monto > 0 || p.recibido), cambio,
    subtotal: c.subtotal, descuentoValor: c.desc, envio: c.envio, propina, total: c.total, arqueoId: asegurarCaja(),
  };
  DB.update('ventas', v.id, patch);
  logAct('venta', `Cobró ${tituloVenta(v)} · ${money(c.total + propina)} · ${patch.pagos.map(p => p.medio).join(' + ')}${v.meseroNombre && v.meseroNombre !== S.user.nombre ? ' · mesero ' + v.meseroNombre : ''}`, { ventaId: v.id, monto: c.total + propina });

  PAY = null; render();
};

A.saveCliente = () => {

A.comEstado = el => {

/* ===================== caja ===================== */
function cajaCalc() {
  const a = S.arqueo;
  const vs = S.ventasCaja.filter(v => v.estado === 'cerrada');
  const porMedio = {}; vs.forEach(v => (v.pagos || []).forEach(p => porMedio[p.medio] = (porMedio[p.medio] || 0) + (p.monto || 0)));
  const movM = {}; S.movs.forEach(m => movM[m.medio] = (movM[m.medio] || 0) + (m.tipo === 'ingreso' ? m.monto : -m.monto));
  const ms = [...new Set(['Efectivo', ...medios(), ...Object.keys(porMedio), ...Object.keys(movM)])];
  const sistema = {}; ms.forEach(m => sistema[m] = (porMedio[m] || 0) + (movM[m] || 0) + (m === 'Efectivo' ? (a.base || 0) : 0));
  return {
    vs, porMedio, movM, ms, sistema,
    ventasTotal: sum(vs, v => v.total), propinas: sum(vs, v => v.propina),
    ingresos: sum(S.movs.filter(m => m.tipo === 'ingreso'), m => m.monto), egresos: sum(S.movs.filter(m => m.tipo === 'egreso'), m => m.monto),
  };
}

  const vs = k.vs.slice().sort((x, y) => (y.cerradaEn || 0) - (x.cerradaEn || 0));
  const resumen = v => { const t = (v.items || []).filter(i => i.estado !== 'anulado').map(i => i.cant + ' ' + i.nombre).join(', '); return t.length > 60 ? t.slice(0, 58) + '…' : t; };
  return topHTML('Caja', `<span class="tag ok">Abierta desde ${hhmm(a.abiertoEn)}</span>`) + `<div class="wrap">
    <div class="row wrap" style="margin-bottom:16px">
      ${canView('vender') ? '<button class="btn pri lg" data-act="nav" data-v="vender">Ir a vender</button>' : ''}
      ${perm('caja') ? '<button class="btn lg" data-act="mov" data-t="egreso">Salida de dinero</button><button class="btn lg" data-act="mov" data-t="ingreso">Entrada de dinero</button><div style="flex:1"></div><button class="btn bad lg" data-act="cerrarCaja">Cerrar caja</button>' : ''}
    </div>
    <div class="kpis">

    <div class="grid2" style="align-items:start;grid-template-columns:2fr 1fr">
      <div class="card" style="overflow:auto"><div class="pad" style="padding-bottom:4px"><h3 class="sec-t" style="margin:0">Ventas de este turno</h3></div>
        ${vs.length ? `<table class="tbl"><thead><tr><th>Hora</th><th>Venta</th><th>Productos</th><th>Pago</th><th class="num">Total</th></tr></thead><tbody>
        ${vs.slice(0, 40).map(v => `<tr class="click" data-act="verVenta" data-id="${v.id}"><td>${hhmm(v.cerradaEn)}</td><td><b>${esc(tituloVenta(v))}</b></td><td class="small">${esc(resumen(v))}</td><td class="small">${esc((v.pagos || []).map(p => p.medio).join(', '))}</td><td class="num"><b>${money((v.total || 0) + (v.propina || 0))}</b></td></tr>`).join('')}

}

function parseMesas(txt) {
  const out = [];

    if (m) { const a = +m[2], b = +m[4], lo = Math.min(a, b), hi = Math.max(a, b); if (hi - lo > 300) return; for (let n = lo; n <= hi; n++) out.push(m[1] + n); }
    else out.push(t);
  });
  return [...new Set(out)];
}

   INVENTARIO: stock, entradas de mercancía, conteo físico e importación
   ===================================================================== */
S.invmovs = null; S.invQ = ''; S.invF = 'todos';
const byCatNombre = (a, b) => ((gCat(a.categoriaId) || {}).orden ?? 999) - ((gCat(b.categoriaId) || {}).orden ?? 999) || String(a.nombre).localeCompare(String(b.nombre), 'es', { numeric: true });
function stockTag(p) {
  if (!p.controlStock) return '<span class="muted">—</span>';
  const st = Number(p.stock) || 0;
  const cls = st <= 0 ? 'bad' : (p.stockMin && st <= p.stockMin ? 'warn' : '');
  return `<span class="stk ${cls}">${num(st)}</span>`;
}
const MOV_LBL = { entrada: ['ok', 'Entrada'], ajuste: ['warn', 'Ajuste'], conteo: ['info', 'Conteo'], importacion: ['', 'Importación'], devolucion: ['ok', 'Devolución'] };

function vInventario() {
  if (S.invmovs == null) {
    S.invmovs = 'loading';
    DB.query('invmov', [['fecha', '>=', now() - 45 * 864e5]]).then(l => { S.invmovs = l.sort((a, b) => b.fecha - a.fecha).slice(0, 40); render(); }).catch(() => { S.invmovs = []; render(); });
  }
  const verC = perm('costos');
  const ctrl = S.productos.filter(p => p.controlStock);
  const stk = p => Math.max(0, Number(p.stock) || 0);
  const agot = ctrl.filter(p => (Number(p.stock) || 0) <= 0);
  const bajos = ctrl.filter(p => { const s = Number(p.stock) || 0; return s > 0 && p.stockMin && s <= p.stockMin; });
  const qn = norm(S.invQ);
  let list = S.invF === 'agotados' ? agot : S.invF === 'bajos' ? bajos : ctrl;
  list = list.filter(p => !qn || norm(p.nombre).includes(qn)).sort(byCatNombre);
  const movs = Array.isArray(S.invmovs) ? S.invmovs : [];
  const head = topHTML('Inventario', `<span class="tag">${ctrl.length} productos con stock</span>`);
  if (!ctrl.length) return head + `<div class="wrap"><div class="card pad empty">
    <h3 class="sec-t">Todavía no hay productos con control de stock</h3>
    <p class="muted" style="margin-bottom:14px">Importa el Excel del inventario o activa "Controlar stock" en cada producto.</p>
    <button class="btn pri" data-act="impAbrir">Importar Excel</button></div></div>`;
  return head + `<div class="wrap">

/* =====================================================================
   IMPORTAR DESDE EXCEL (.xlsx, .xls o .csv)
   ===================================================================== */
const XLSX_URLS = ['https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs', 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/xlsx.mjs'];
let XLSXmod = null, IMP = null;
async function loadXLSX() {
  if (XLSXmod) return XLSXmod;
  for (const u of XLSX_URLS) { try { XLSXmod = await import(u); return XLSXmod; } catch (e) { console.warn('No cargó', u, e); } }
  throw new Error('No se pudo cargar el lector de Excel. Revisa la conexión a internet.');
}
const IMP_CAMPOS = [['nombre', 'Producto *'], ['precio', 'Precio de venta *'], ['costo', 'Costo'], ['stock', 'Stock'], ['categoria', 'Categoría'], ['stockMin', 'Stock mínimo'], ['comanda', 'Va a comanda (Sí/No)'], ['opciones', 'Opciones / sabores'], ['porCaja', 'Unidades por caja']];
const IMP_RX = {
  nombre: /^(producto|productos|nombre|descripcion|articulo|item|referencia)/,
  precio: /^(precio\s*(de\s*)?venta|pvp|precio|valor\s*venta|precio\s*unitario)$/,
  costo: /costo|precio\s*(de\s*)?(factura|compra)|valor\s*compra/,
  stock: /^(stock|existencia|existencias|inventario|saldo|cantidad\s*actual)/,
  categoria: /categor|grupo|familia|seccion|^tipo/,
  stockMin: /minimo|^min\b/,
  comanda: /comanda|cocina|barra|prepara/,
  opciones: /opcion|sabor|variante/,
  porCaja: /(unidades|und|unid)\.?\s*(por|x)\s*caja|^por\s*caja|^x\s*caja|^caja\s*(x|de)/,
};
const colLetter = c => { let s = ''; c++; while (c > 0) { const m = (c - 1) % 26; s = String.fromCharCode(65 + m) + s; c = Math.floor((c - 1) / 26); } return s; };
function toNum(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') return v;
  let s = String(v).replace(/[$\s]/g, '');
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
  else s = s.replace(',', '.');
  const n = parseFloat(s); return isNaN(n) ? null : n;
}
function impLoadSheet() {
  const ws = IMP.wb.Sheets[IMP.sheet];
  const rows = XLSXmod.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: false });
  const all = Object.values(IMP_RX);
  let hi = -1, best = 0;
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    const sc = (rows[i] || []).filter(c => typeof c === 'string' && all.some(rx => rx.test(norm(c).trim()))).length;
    if (sc > best) { best = sc; hi = i; }
  }
  const ncol = Math.max(0, ...rows.slice(0, 60).map(r => (r ? r.length : 0)));
  IMP.headers = Array.from({ length: ncol }, (_, c) => { const h = hi >= 0 ? (rows[hi] || [])[c] : null; return h != null && String(h).trim() ? String(h).trim() : 'Columna ' + colLetter(c); });
  IMP.data = rows.slice(hi + 1);
  const map = {}, used = new Set();
  IMP_CAMPOS.forEach(([k]) => {
    const i = IMP.headers.findIndex((h, c) => !used.has(c) && !/^Columna /.test(h) && IMP_RX[k].test(norm(h).trim()));
    map[k] = i; if (i >= 0) used.add(i);
  });
  if (map.nombre < 0) { // la columna con más textos
    let bc = -1, bn = 0;
    for (let c = 0; c < ncol; c++) { if (used.has(c)) continue; const n = IMP.data.filter(r => r && typeof r[c] === 'string' && r[c].trim().length > 1).length; if (n > bn) { bn = n; bc = c; } }
    map.nombre = bc;
  }
  IMP.map = map;
}
function impRows() {
  const m = IMP.map, out = new Map(); let ign = 0;
  const cell = (r, k) => (m[k] >= 0 && r ? r[m[k]] : null);
  IMP.data.forEach(r => {
    const nRaw = cell(r, 'nombre');
    const nombre = typeof nRaw === 'string' ? nRaw.trim().replace(/\s+/g, ' ') : '';
    const precio = toNum(cell(r, 'precio'));
    if (!nombre || !(precio > 0) || /^(total|subtotal|gastos|ventas|ganancia|porcentaje)/.test(norm(nombre))) { if (r && r.some(c => c != null && c !== '')) ign++; return; }
    const stRaw = cell(r, 'stock'); const st = stRaw == null || stRaw === '' ? null : toNum(stRaw);
    const cm = cell(r, 'comanda');
    out.set(norm(nombre), {
      nombre, precio: Math.round(precio), costo: Math.round(toNum(cell(r, 'costo')) || 0), stock: st, stockMin: toNum(cell(r, 'stockMin')) || 0,
      categoria: String(cell(r, 'categoria') ?? '').trim(),
      comanda: m.comanda < 0 ? true : (cm != null && /^(si|s|x|1|true|yes)$/.test(norm(cm).trim())),
      opciones: String(cell(r, 'opciones') ?? '').split(',').map(x => x.trim()).filter(Boolean),
      porCaja: Math.max(0, Math.round(toNum(cell(r, 'porCaja')) || 0)),
    });
  });
  const rows = [...out.values()];
  rows.forEach(x => { x.existe = S.productos.find(p => norm(p.nombre).trim() === norm(x.nombre).trim()) || null; });
  return { rows, ign };
}
function impHTML() {

    <div class="field"><input class="inp" type="file" id="imp_file" data-ch="impFile" accept=".xlsx,.xls,.csv"></div>
    ${IMP && IMP.err ? `<p class="small" style="color:var(--bad)">${esc(IMP.err)}</p>` : ''}${IMP && IMP.loading ? '<p class="muted small">Leyendo el archivo…</p>' : ''}

  const { rows, ign } = impRows();
  const nuevos = rows.filter(r => !r.existe).length, upd = rows.length - nuevos;

  return `${mHead('Importar · ' + esc(IMP.fileName))}<div class="mb">

const PERIODOS = [['hoy', 'Hoy'], ['7d', 'Últimos 7 días'], ['mes', 'Este mes'], ['mesant', 'Mes anterior']];
function rangoPeriodo(k) {
  const d0 = inicioJornada(), D = 864e5, n = new Date(Date.now() - CORTE_MS);
  const ini = new Date(n.getFullYear(), n.getMonth(), 1).getTime() + CORTE_MS;
  if (k === '7d') return [d0 - 6 * D, d0 + D];
  if (k === 'mes') return [ini, d0 + D];
  if (k === 'mesant') return [new Date(n.getFullYear(), n.getMonth() - 1, 1).getTime() + CORTE_MS, ini];
  return [d0, d0 + D];
}
function vMeseros() {

    const k = S.mPer, [a, b] = rangoPeriodo(k);

    DB.query('ventas', [['cerradaEn', '>=', a], ['cerradaEn', '<', b]]).then(l => { if (S.mData && S.mData.k === k) { S.mData.list = l; render(); } }).catch(e => { console.error(e); toast('No se pudieron cargar las ventas', 'err'); });
  }
  const per = `<div class="tabs" style="margin-bottom:14px">${PERIODOS.map(([k, l]) => `<button class="${S.mPer === k ? 'on' : ''}" data-act="mPer" data-p="${k}">${l}</button>`).join('')}</div>`;
  const list = S.mData.list;
  if (!list) return head + `<div class="wrap">${ventasTabs()}${per}<div class="card empty">Cargando…</div></div>`;
  const R = {};
  const get = n => R[n] = R[n] || { n, cuentas: 0, ventas: 0, prop: 0, prods: 0, anul: 0, anulVal: 0 };
  list.forEach(v => {
    if (v.estado === 'cerrada') {
      const r = get(v.meseroNombre || v.cerradaPor || 'Sin asignar');
      r.cuentas++; r.ventas += v.total || 0; r.prop += v.propina || 0;
      r.prods += sum((v.items || []).filter(i => i.estado !== 'anulado'), i => i.cant);
    }
    (v.items || []).filter(i => i.estado === 'anulado' && i.anuladoPor).forEach(i => { const r = get(i.anuladoPor); r.anul += i.cant; r.anulVal += i.precio * i.cant; });
    if (v.estado === 'anulada' && v.anuladaPor && v.anuladaMotivo !== 'Sin consumo') { const r = get(v.anuladaPor); const t = calc(v).total; if (t) { r.anul += sum((v.items || []).filter(i => i.estado !== 'anulado'), i => i.cant); r.anulVal += t; } }
  });
  const rows = Object.values(R).filter(r => r.cuentas || r.anul).sort((a, b) => b.ventas - a.ventas);
  const max = Math.max(1, ...rows.map(r => r.ventas));
  const top = rows[0];
  const uByName = n => S.usuarios.find(u => u.nombre === n) || { id: n, nombre: n };
  return head + `<div class="wrap">${ventasTabs()}${per}
    ${top && top.ventas ? `<div class="card pad" style="margin-bottom:14px;display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,#fff8e1,#fff)">
      <div style="font-size:34px">🏆</div><div><div class="muted small">Quien más vendió · ${PERIODOS.find(p => p[0] === S.mPer)[1].toLowerCase()}</div><div style="font-size:21px;font-weight:800">${esc(top.n)} · ${money(top.ventas)}</div><div class="muted small">${top.cuentas} ${top.cuentas === 1 ? 'venta' : 'ventas'} · ${top.prods} productos</div></div></div>` : ''}
    <div class="card" style="overflow:auto">${rows.length ? `<table class="tbl"><thead><tr><th>#</th><th>Mesero / vendedor</th><th class="num">Ventas</th><th style="min-width:140px"></th><th class="num">Cuentas</th><th class="num">Productos</th><th class="num">Ticket prom.</th><th class="num">Propinas</th><th class="num">Anulado</th></tr></thead><tbody>
      ${rows.map((r, i) => `<tr><td><b>${i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1}</b></td><td><div class="row">${avatar(uByName(r.n), 30)}<b>${esc(r.n)}</b></div></td>
        <td class="num"><b>${money(r.ventas)}</b></td><td><div style="height:10px;border-radius:6px;background:var(--bg)"><div style="height:10px;border-radius:6px;background:var(--accent);width:${Math.round(r.ventas / max * 100)}%"></div></div></td>
        <td class="num">${r.cuentas}</td><td class="num">${r.prods}</td><td class="num">${money(r.cuentas ? r.ventas / r.cuentas : 0)}</td><td class="num">${money(r.prop)}</td>
        <td class="num" style="color:${r.anul ? 'var(--bad)' : 'inherit'}">${r.anul ? `${r.anul} und · ${money(r.anulVal)}` : '—'}</td></tr>`).join('')}
    </tbody></table>` : '<div class="empty">No hay ventas en este periodo</div>'}</div>
    <p class="muted small" style="margin-top:10px">Las ventas de mesa cuentan para el mesero asignado a la mesa; las ventas rápidas, para quien las cobró. "Anulado" es lo que esa persona anuló.</p>
  </div>`;
}
A.mPer = el => { S.mPer = el.dataset.p; render(); };

/* ---------- registro de actividad ---------- */
const ACT_LBL = { venta: ['ok', 'Venta'], anulacion: ['bad', 'Anulación'], descuento: ['warn', 'Descuento'], caja: ['info', 'Caja'], inventario: ['', 'Inventario'], pedido: ['', 'Pedido'], mesa: ['', 'Mesa'], sesion: ['', 'Sesión'], ajustes: ['warn', 'Ajustes'] };
function vActividad() {
  const head = topHTML('Ventas', `<input type="date" class="inp" style="width:auto;min-height:38px" data-ch="vdia" value="${S.ventasDia}" max="${diaJornada(now())}">`);
  if (!S.aData || S.aData.dia !== S.ventasDia) {
    const dia = S.ventasDia, st = inicioDia(dia);
    S.aData = { dia, list: null };
    DB.query('actividad', [['fecha', '>=', st], ['fecha', '<', st + 864e5]]).then(l => { if (S.aData && S.aData.dia === dia) { S.aData.list = l.sort((a, b) => b.fecha - a.fecha); render(); } }).catch(e => { console.error(e); toast('No se pudo cargar el registro', 'err'); });
  }
  const list = S.aData.list;
  const filtros = `<div class="row wrap" style="margin-bottom:12px">
    <select class="inp" style="width:auto;min-height:38px" data-ch="aUser"><option value="">Todas las personas</option>${S.usuarios.map(u => `<option ${S.aUser === u.nombre ? 'selected' : ''}>${esc(u.nombre)}</option>`).join('')}</select>
    <select class="inp" style="width:auto;min-height:38px" data-ch="aTipo"><option value="">Todo</option>${Object.entries(ACT_LBL).map(([k, l]) => `<option value="${k}" ${S.aTipo === k ? 'selected' : ''}>${l[1]}</option>`).join('')}</select>
    <button class="btn sm" data-act="aRefresh">Actualizar</button></div>`;
  if (!list) return head + `<div class="wrap">${ventasTabs()}${filtros}<div class="card empty">Cargando…</div></div>`;
  const ls = list.filter(a => (!S.aUser || a.usuario === S.aUser) && (!S.aTipo || a.tipo === S.aTipo));
  const nAn = list.filter(a => a.tipo === 'anulacion').length;
  return head + `<div class="wrap">${ventasTabs()}${filtros}
    ${nAn ? `<div class="lic-bar warn" style="border-radius:12px;margin-bottom:12px;text-align:left">Este día hay ${nAn} ${nAn === 1 ? 'anulación' : 'anulaciones'}. <button data-act="aSoloAnul">Ver solo anulaciones</button></div>` : ''}
    <div class="card" style="overflow:auto">${ls.length ? `<table class="tbl"><thead><tr><th>Hora</th><th>Quién</th><th>Qué</th><th>Detalle</th></tr></thead><tbody>
      ${ls.map(a => { const lb = ACT_LBL[a.tipo] || ['', a.tipo]; return `<tr><td class="small" style="white-space:nowrap">${hhmm(a.fecha)}</td><td style="white-space:nowrap"><b>${esc(a.usuario)}</b><div class="muted small">${esc(rolName(a.rol))}</div></td><td><span class="tag ${lb[0]}">${lb[1]}</span></td><td>${esc(a.texto)}${a.motivo ? `<div class="small" style="color:var(--bad)">Motivo: ${esc(a.motivo)}</div>` : ''}</td></tr>`; }).join('')}
    </tbody></table>` : '<div class="empty">No hay actividad registrada con ese filtro</div>'}</div>
  </div>`;
}
CH.aUser = el => { S.aUser = el.value; render(); };
CH.aTipo = el => { S.aTipo = el.value; render(); };
A.aRefresh = () => { S.aData = null; render(); };
A.aSoloAnul = () => { S.aTipo = 'anulacion'; render(); };

/* ===================== inicio ===================== */
if (location.hash === '#nexora') bootAdmin(); else boot();
window.addEventListener('hashchange', () => location.reload());

</script>
</body>
</html>
