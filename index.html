<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NEXORA POS">
<title>NEXORA POS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%233b5bdb'/%3E%3Cpath d='M14 34V14l20 20V14' stroke='%23fff' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f4f7; --card:#fff; --ink:#0f172a; --ink2:#334155; --muted:#64748b; --line:#e3e7ee;
  --nav:#0b1220; --nav2:#1a2436; --accent:#3b5bdb; --accent2:#e8edff;
  --ok:#16a34a; --ok2:#e8f7ee; --warn:#e8930c; --warn2:#fff4e0; --info:#2f74e0; --info2:#e6f0ff;
  --bad:#dc2626; --bad2:#fdecec; --r:14px; --sh:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- layout ---------- */
#app{display:flex;height:100vh;height:100dvh}
.nav{width:88px;flex:none;background:var(--nav);color:#aab4c6;display:flex;flex-direction:column;align-items:center;padding:14px 0 10px;gap:4px;overflow-y:auto}
.brand{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:12px;color:#fff;font-weight:800;font-size:11px;letter-spacing:.08em}
.brand svg{width:34px;height:34px}
.nav .nb{width:74px;padding:10px 4px 8px;border-radius:12px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative}
.nav .nb svg{width:22px;height:22px}
.nav .nb:hover{background:var(--nav2);color:#fff}
.nav .nb.on{background:var(--accent);color:#fff}
.nav .badge{position:absolute;top:4px;right:10px;background:var(--bad);color:#fff;border-radius:99px;font-size:10.5px;min-width:18px;height:18px;line-height:18px;padding:0 5px;font-weight:700}
.nav .sp{flex:1}
main{flex:1;min-width:0;overflow:auto;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top h1{font-size:20px;font-weight:750;letter-spacing:-.01em}
.top .grow{flex:1}
.uchip{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;border:1px solid var(--line);border-radius:99px;font-size:13px;color:var(--ink2)}
.uchip b{font-weight:650;color:var(--ink)}
.uchip button{background:var(--bg);border-radius:99px;padding:5px 10px;font-size:12.5px;font-weight:600}
.wrap{padding:20px 22px 40px}
.demo-bar{background:#fff7d6;color:#7a5a00;font-size:12.5px;text-align:center;padding:5px 10px;border-bottom:1px solid #f1e3a6}

/* ---------- generic ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 16px;border-radius:11px;font-weight:650;background:var(--card);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#c9d0dc}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:34px;padding:0 11px;font-size:13.5px;border-radius:9px}
.btn.lg{min-height:52px;font-size:16.5px;padding:0 22px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600;color:var(--ink2)}
.inp,select.inp,textarea.inp{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}
textarea.inp{min-height:70px;resize:vertical}
.chk{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer;min-height:36px}
.chk input{width:19px;height:19px;accent-color:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--bg);color:var(--ink2);white-space:nowrap}
.tag.ok{background:var(--ok2);color:#0f7a37}
.tag.warn{background:var(--warn2);color:#9a5b00}
.tag.info{background:var(--info2);color:#1d55b5}
.tag.bad{background:var(--bad2);color:#b01c1c}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{padding:8px 14px;border-radius:99px;font-weight:600;font-size:14px;background:var(--card);border:1px solid var(--line)}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:650;padding:10px 12px;border-bottom:1px solid var(--line);background:#fafbfc}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#f8fafc}
.tbl th.num{text-align:right}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:16px 18px}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:24px;font-weight:780;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sec-t{font-size:15px;font-weight:720;margin:0 0 10px}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px;gap:10px}
.list-row:last-child{border-bottom:0}

/* ---------- login / pin ---------- */
.center{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1200px 600px at 20% 0%,#1d2a48 0%,var(--nav) 55%)}
.login{width:100%;max-width:420px;padding:28px}
.login h2{font-size:22px;margin-bottom:4px}
.logo-big{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.logo-big svg{width:46px;height:46px}
.logo-big b{font-size:19px;letter-spacing:.06em}
.ulist{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-top:14px}
.ubtn{padding:16px 10px;border:1px solid var(--line);border-radius:14px;background:#fff;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:650;font-size:14px}
.ubtn:hover{border-color:var(--accent)}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:17px}
.pindots{display:flex;justify-content:center;gap:14px;margin:18px 0}
.pindots i{width:15px;height:15px;border-radius:50%;border:2px solid #b8c1d1}
.pindots i.f{background:var(--ink);border-color:var(--ink)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pinpad button{height:62px;border-radius:14px;background:var(--bg);font-size:22px;font-weight:650}
.pinpad button:active{background:#e2e6ee}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ---------- salon ---------- */
.salon-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-left:auto;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:4px;display:inline-block}
.plano{position:relative;height:600px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);background-image:radial-gradient(#e5e9f0 1px,transparent 1px);background-size:22px 22px;overflow:hidden}
.plano.edit{outline:2px dashed var(--accent);outline-offset:3px}
.mesa{position:absolute;width:118px;height:96px;border-radius:16px;background:#fff;border:2px solid #cfe9d8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;box-shadow:0 2px 6px rgba(15,23,42,.07);user-select:none;touch-action:none;transition:box-shadow .15s}
.mesa:hover{box-shadow:0 6px 18px rgba(15,23,42,.13)}
.mesa.redonda{border-radius:50%;width:104px;height:104px}
.mesa .mn{font-weight:800;font-size:17px}
.mesa .mt{font-weight:750;font-size:13.5px;font-variant-numeric:tabular-nums}
.mesa .ms{font-size:11.5px;color:var(--muted)}
.mesa.libre{border-color:#bfe5cc}
.mesa.libre .mn{color:#15803d}
.mesa.ocupada{background:var(--warn2);border-color:#f3c46e}
.mesa.precuenta{background:var(--info2);border-color:#8fb6f3}
.mesa .dot{position:absolute;top:7px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--bad)}
.plano.edit .mesa{cursor:grab}
.plano.edit .mesa:active{cursor:grabbing}
@media (max-width:760px){
  .plano{height:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px;background-image:none}
  .mesa,.mesa.redonda{position:relative!important;left:auto!important;top:auto!important;width:auto;height:92px;border-radius:14px}
}

/* ---------- pedido ---------- */
.pv{display:grid;grid-template-columns:minmax(0,1fr) 400px;flex:1;min-height:0}
.pv-left{padding:16px 18px;overflow:auto;min-height:0}
.pv-right{background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:12px 0}
.cats button{padding:9px 15px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:650;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:7px}
.cats button i{width:9px;height:9px;border-radius:50%}
.cats button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 12px 11px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:88px;border-top:4px solid var(--c,#cbd5e1);transition:transform .08s}
.prod:active{transform:scale(.97)}
.prod b{font-size:14.5px;font-weight:680;line-height:1.25}
.prod span{font-size:14px;color:var(--ink2);font-weight:650;margin-top:auto;font-variant-numeric:tabular-nums}
.prod{position:relative}
.prod .pq{position:absolute;bottom:10px;right:10px;background:var(--warn);color:#fff;border-radius:99px;font-style:normal;font-size:12px;font-weight:800;min-width:22px;height:22px;line-height:22px;text-align:center;padding:0 6px}
.lnk{color:var(--accent);font-weight:650;font-size:12.5px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chips button{padding:7px 11px;border-radius:99px;background:var(--bg);font-size:13px;font-weight:600}
.chips button:hover{background:var(--accent2);color:var(--accent)}
.opt{display:flex;width:100%;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--line);font-weight:620;text-align:left}
.opt:last-child{border-bottom:0}
.opt.bad{color:var(--bad)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:10px;border:3px solid transparent}
.swatches button.on{border-color:var(--ink)}
.acct-h{padding:14px 18px;border-bottom:1px solid var(--line)}
.acct-items{flex:1;overflow:auto;padding:6px 18px}
.it{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.it .c{min-width:28px;font-weight:800;color:var(--ink2)}
.it .n{flex:1;min-width:0}
.it .n b{font-weight:620;font-size:14.5px}
.it .n .nt{font-size:12.5px;color:var(--warn);font-weight:600}
.it .n .x{font-size:12px;color:var(--muted)}
.it .p{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.it.anulado .n b,.it.anulado .p,.it.anulado .c{text-decoration:line-through;color:#a0a9b8}
.it .rm{color:var(--muted);padding:2px 6px;border-radius:7px;font-size:16px;line-height:1}
.it .rm:hover{background:var(--bad2);color:var(--bad)}
.draft{background:#fffaf0;border:1px dashed #f0c674;border-radius:12px;padding:4px 12px;margin:8px 0}
.draft .ttl{font-size:12px;font-weight:750;color:#9a5b00;text-transform:uppercase;letter-spacing:.05em;padding:8px 0 2px}
.draft .it{border-bottom-color:#f5e3bd}
.draft .it:last-child{border-bottom:0}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:30px;height:30px;border-radius:8px;background:#fff;border:1px solid var(--line);font-weight:800;font-size:16px}
.qty span{min-width:22px;text-align:center;font-weight:750}
.acct-f{border-top:1px solid var(--line);padding:14px 18px 16px;display:flex;flex-direction:column;gap:10px;background:#fbfcfd}
.tot{display:flex;justify-content:space-between;font-size:14px;color:var(--ink2)}
.tot.big{font-size:21px;font-weight:800;color:var(--ink)}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mtabs{display:none}
@media (max-width:900px){
  .pv{grid-template-columns:1fr}
  .pv-right{border-left:0}
  .pv.show-acct .pv-left{display:none}
  .pv:not(.show-acct) .pv-right{display:none}
  .mtabs{display:flex;gap:6px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
  .mtabs button{flex:1;padding:10px;border-radius:10px;font-weight:700;background:var(--bg)}
  .mtabs button.on{background:var(--ink);color:#fff}
}

.split{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}

/* ---------- pedidos / cocina ---------- */
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.oc{padding:14px 16px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.oc:hover{border-color:#c9d0dc}
.oc h3{font-size:16px}
.kds{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;align-items:start}
.kc{overflow:hidden}
.kc .kh{padding:11px 14px;display:flex;justify-content:space-between;align-items:center;color:#fff;background:#334155}
.kc.pendiente .kh{background:#475569}
.kc.preparando .kh{background:var(--warn)}
.kc.tarde .kh{background:var(--bad)}
.kc.anul .kh{background:#7f1d1d}
.kc .kh b{font-size:17px}
.kc ul{list-style:none;padding:8px 14px}
.kc li{padding:7px 0;border-bottom:1px dashed var(--line);font-size:15.5px}
.kc li:last-child{border-bottom:0}
.kc li b{font-size:17px;margin-right:6px}
.kc li .nt{display:block;font-size:13px;color:var(--bad);font-weight:650}
.kc .kf{padding:10px 14px 14px;display:flex;gap:8px}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(10,15,28,.45)}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:18px;width:100%;max-width:460px;max-height:calc(100dvh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .16s ease-out}
.mbox.wide{max-width:640px}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.mh{padding:18px 20px 6px;display:flex;align-items:center;justify-content:space-between}
.mh h3{font-size:18px}
.mb{padding:10px 20px}
.mf{padding:12px 20px 18px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.xbtn{width:34px;height:34px;border-radius:9px;font-size:20px;color:var(--muted)}
.xbtn:hover{background:var(--bg)}
.seg{display:flex;background:var(--bg);border-radius:11px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px;border-radius:8px;font-weight:650;font-size:14px}
.seg button.on{background:#fff;box-shadow:var(--sh)}
.medios{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.medios button{padding:10px 14px;border-radius:11px;border:1px solid var(--line);font-weight:650;background:#fff}
.medios button:hover{border-color:var(--accent);color:var(--accent)}
.payrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.payrow .pm{flex:1;font-weight:650}
.payrow input{width:150px;text-align:right}
.paysum{border-radius:12px;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between}
.paysum.falta{background:var(--bad2);color:#b01c1c}
.paysum.okk{background:var(--ok2);color:#0f7a37}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:46px;height:46px;border-radius:12px;background:var(--bg);font-size:22px;font-weight:700}
.stepper b{font-size:24px;min-width:36px;text-align:center}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:pop .2s}
#toast div.err{background:var(--bad)}
#toast div.ok{background:#0f7a37}

/* ---------- mobile nav ---------- */
@media (max-width:760px){
  #app{flex-direction:column-reverse}
  .nav{width:100%;height:66px;flex-direction:row;justify-content:space-around;padding:4px 2px;gap:0;overflow-x:auto;overflow-y:hidden}
  .brand,.nav .sp{display:none}
  .nav .nb{width:auto;min-width:58px;flex:1;padding:7px 2px 5px;font-size:10.5px}
  .top{padding:11px 14px}
  .top h1{font-size:18px}
  .wrap{padding:14px 14px 30px}
  .grid2,.grid3{grid-template-columns:1fr}
  .uchip span{display:none}
  .top{flex-wrap:nowrap;gap:8px}
  .top h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .top .tag{display:none}
  .uchip{padding:3px 3px 3px 10px;flex:none}
  .uchip b{max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #toast{bottom:84px}
  .mtabs .tag{display:inline-flex;font-size:10.5px;padding:2px 6px}
}

/* ---------- licencia ---------- */
.lic-bar{padding:8px 14px;font-size:13px;text-align:center;font-weight:600;line-height:1.4}
.lic-bar.warn{background:var(--warn2);color:#8a5200;border-bottom:1px solid #f3d9a6}
.lic-bar.bad{background:var(--bad);color:#fff}
.lic-bar button{margin-left:8px;text-decoration:underline;font-weight:750;color:inherit}
a.btn{text-decoration:none}
.adm{min-height:100vh;min-height:100dvh}
.adm .top .logo-big{margin:0}
.adm .top .logo-big svg{width:38px;height:38px}
@media (max-width:760px){
  .adm .top{flex-wrap:wrap}
  .adm .top .grow{flex-basis:100%;height:0}
  .adm .kpis{grid-template-columns:1fr 1fr}
  .adm .tbl thead{display:none}
  .adm .tbl,.adm .tbl tbody,.adm .tbl tr,.adm .tbl td{display:block;width:100%}
  .adm .tbl tr{padding:12px 14px;border-bottom:1px solid var(--line)}
  .adm .tbl td{border:0;padding:3px 0;text-align:left}

const $ = (s, r = document) => r.querySelector(s);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const fecha = t => t ? new Date(t).toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
const fechaHora = t => t ? fecha(t) + ' ' + hhmm(t) : '';
const mins = t => Math.max(0, Math.floor((Date.now() - t) / 60000));

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

const colorFor = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; };
const sum = (arr, f) => arr.reduce((a, x) => a + (Number(f ? f(x) : x) || 0), 0);
const endOfDay = t => { const d = new Date(t); d.setHours(23, 59, 59, 999); return d.getTime(); };
const addMonths = (t, n) => { const d = new Date(t); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return d.getTime(); };

function licStatus(l, t = Date.now()) {
  if (!l) return { k: 'pendiente' };
  const DAY = 864e5, hasta = l.pagadoHasta || 0, g = Number(l.diasGracia ?? 3), fin = endOfDay(hasta + g * DAY);

  const dias = Math.floor((hasta - t) / DAY);
  return { k: dias <= 5 ? 'aviso' : 'aldia', dias, fin };
}
const dayInput = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

function toast(msg, type = '') {
  const t = document.createElement('div');

async function hashPin(pin, salt) {
  const txt = salt + ':' + pin;
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) { let h = 5381; for (const c of txt) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return 'x' + h.toString(16); }
}

/* ---------------- roles y permisos ---------------- */
const PERMS = [
  ['salon', 'Salón: abrir mesas y tomar pedidos'],
  ['pedidos', 'Mostrador y domicilios'],
  ['cobrar', 'Cobrar y cerrar ventas'],
  ['descuentos', 'Aplicar descuentos'],

  ['cocina', 'Pantalla de cocina'],

  ['anularVenta', 'Anular ventas cerradas'],

  ['ajustes', 'Ajustes, usuarios y plano de mesas'],
];
const ROLES = { admin: 'Administrador', cajero: 'Cajero', mesero: 'Mesero', cocina: 'Cocina' };
const DEFAULT_PERMS = {
  cajero: { salon: 1, pedidos: 1, cobrar: 1, descuentos: 1, anular: 1, cocina: 1, caja: 1, ventas: 1 },
  mesero: { salon: 1 },
  cocina: { cocina: 1 },
};

/* ---------------- capa de datos (Firestore o demo local) ---------------- */
const DB = (() => {
  let mode = null, nid = null, F = null, A = null, fdb = null, auth = null;
  const LKEY = 'nexorapos_demo_v1';
  let store = {};
  const listeners = new Set();

  const loadLocal = () => { try { store = JSON.parse(localStorage.getItem(LKEY)) || {}; } catch (e) { store = {}; } };
  const saveLocal = () => { try { localStorage.setItem(LKEY, JSON.stringify(store)); } catch (e) { console.warn(e); } };
  const match = (d, filters) => (filters || []).every(([f, op, v]) => {
    const x = d[f];
    switch (op) {
      case '==': return x === v; case '!=': return x !== v; case '>=': return x >= v; case '<=': return x <= v;
      case '>': return x > v; case '<': return x < v; case 'in': return v.includes(x);
    } return true;
  });
  const localList = (col, filters) => Object.entries(store[col] || {}).map(([id, d]) => ({ id, ...d })).filter(d => match(d, filters));
  const notify = col => listeners.forEach(l => { if (l.col === col) l.fire(); });
  window.addEventListener('storage', e => {
    if (e.key === LKEY && mode === 'local') { loadLocal(); new Set([...listeners].map(l => l.col)).forEach(notify); }
  });
  const ref = (col, id) => F.doc(fdb, 'negocios', nid, col, id);
  const cref = col => F.collection(fdb, 'negocios', nid, col);
  const fail = what => err => { console.error(what, err); toast('No se pudo guardar (' + (err.code || err.message) + ')', 'err'); };

  return {
    get mode() { return mode; },
    get nid() { return nid; },
    async init() {
      if (!FIREBASE_CONFIG) { mode = 'local'; loadLocal(); nid = 'demo'; return; }
      mode = 'firebase';
      const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
      const [appM, authM, fsM] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
      const app = appM.initializeApp(FIREBASE_CONFIG);
      A = authM; F = fsM; auth = A.getAuth(app);
      try { fdb = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
      catch (e) { fdb = F.getFirestore(app); }
    },
    onAuth(cb) { if (mode === 'local') { cb({ uid: 'demo' }); return; } A.onAuthStateChanged(auth, cb); },
    login(email, pass) { return A.signInWithEmailAndPassword(auth, email, pass); },
    logout() { if (mode === 'firebase') return A.signOut(auth); },
    setNegocio(id) { nid = id; },
    newId(col) { return mode === 'local' ? uid() : F.doc(cref(col)).id; },
    sub(col, filters, cb) {
      if (mode === 'local') {
        const l = { col, fire: () => cb(localList(col, filters)) };
        listeners.add(l); l.fire(); return () => listeners.delete(l);
      }
      let q = cref(col);
      if (filters && filters.length) q = F.query(q, ...filters.map(([f, op, v]) => F.where(f, op, v)));
      return F.onSnapshot(q, s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), err => { console.error(col, err); toast('Error de conexión (' + col + '): ' + err.code, 'err'); });
    },
    subDoc(col, id, cb) {
      if (mode === 'local') {
        const l = { col, fire: () => { const d = (store[col] || {})[id]; cb(d ? { id, ...d } : null); } };
        listeners.add(l); l.fire(); return () => listeners.delete(l);
      }
      return F.onSnapshot(ref(col, id), s => cb(s.exists() ? { id: s.id, ...s.data() } : null), err => console.error(col, err));
    },
    async query(col, filters) {
      if (mode === 'local') return localList(col, filters);
      let q = cref(col);
      if (filters && filters.length) q = F.query(q, ...filters.map(([f, op, v]) => F.where(f, op, v)));
      const s = await F.getDocs(q); return s.docs.map(d => ({ id: d.id, ...d.data() }));
    },
    async get(col, id) {
      if (mode === 'local') { const d = (store[col] || {})[id]; return d ? { id, ...d } : null; }
      const s = await F.getDoc(ref(col, id)); return s.exists() ? { id: s.id, ...s.data() } : null;
    },
    set(col, id, data, merge = true) {
      if (mode === 'local') {
        store[col] = store[col] || {};
        store[col][id] = merge ? { ...(store[col][id] || {}), ...data } : { ...data };
        saveLocal(); notify(col); return;
      }
      F.setDoc(ref(col, id), data, { merge }).catch(fail(col));
    },
    add(col, data) { const id = this.newId(col); this.set(col, id, data, false); return id; },
    update(col, id, patch) {
      if (mode === 'local') {
        if (!(store[col] || {})[id]) return;
        store[col][id] = { ...store[col][id], ...patch }; saveLocal(); notify(col); return;
      }
      F.updateDoc(ref(col, id), patch).catch(fail(col));
    },
    /* agrega elementos a un arreglo de forma atómica (funciona sin internet) */
    append(col, id, field, items, patch = {}) {
      if (mode === 'local') {
        const d = (store[col] || {})[id]; if (!d) return;
        store[col][id] = { ...d, ...patch, [field]: [...(d[field] || []), ...items] }; saveLocal(); notify(col); return;
      }
      F.updateDoc(ref(col, id), { ...patch, [field]: F.arrayUnion(...items) }).catch(fail(col));
    },
    /* modifica un documento leyendo su versión más reciente (transacción si hay internet) */
    mutate(col, id, fn, cached) {
      if (mode === 'local') {
        const d = (store[col] || {})[id]; if (!d) return;
        const patch = fn({ id, ...d }); if (patch) { store[col][id] = { ...d, ...patch }; saveLocal(); notify(col); } return;
      }
      F.runTransaction(fdb, async tx => {
        const s = await tx.get(ref(col, id)); if (!s.exists()) return;
        const patch = fn({ id: s.id, ...s.data() }); if (patch) tx.update(ref(col, id), patch);
      }).catch(err => {
        console.warn('transacción falló, guardando directo', err);
        if (cached) { const patch = fn(cached); if (patch) F.updateDoc(ref(col, id), patch).catch(fail(col)); }
      });
    },
    del(col, id) {
      if (mode === 'local') { if (store[col]) { delete store[col][id]; saveLocal(); notify(col); } return; }
      F.deleteDoc(ref(col, id)).catch(fail(col));
    },
    async seed(data, rootData) {
      if (mode === 'local') {
        for (const [col, docs] of Object.entries(data)) { store[col] = { ...(store[col] || {}), ...docs }; }
        store.__root = rootData; saveLocal(); return;
      }
      const b = F.writeBatch(fdb);
      b.set(F.doc(fdb, 'negocios', nid), rootData);
      for (const [col, docs] of Object.entries(data)) for (const [id, d] of Object.entries(docs)) b.set(ref(col, id), d);
      await b.commit();
    },
    async hasNegocio() {
      if (mode === 'local') return !!store.__root;
      const s = await F.getDoc(F.doc(fdb, 'negocios', nid)); return s.exists();
    },
    /* ---- colecciones raíz: licencias y panel NEXORA ---- */
    localHas(col) { return !!store['R:' + col]; },
    rsubDoc(path, cb) {
      const p = path.split('/'); const id = p.pop(); const col = p.join('/');
      if (mode === 'local') {
        const key = 'R:' + col;
        const l = { col: key, fire: () => { const d = (store[key] || {})[id]; cb(d ? { id, ...d } : null); } };
        listeners.add(l); l.fire(); return () => listeners.delete(l);
      }
      return F.onSnapshot(F.doc(fdb, path), s => {
        if (!s.exists()) { cb(s.metadata.fromCache ? { error: 'offline' } : null); return; }
        cb({ id: s.id, ...s.data() });
      }, err => { console.error(path, err); cb({ error: err.code || 'error' }); });
    },
    rsub(col, cb, onErr) {
      if (mode === 'local') {
        const key = 'R:' + col;
        const l = { col: key, fire: () => cb(Object.entries(store[key] || {}).map(([id, d]) => ({ id, ...d }))) };
        listeners.add(l); l.fire(); return () => listeners.delete(l);
      }
      return F.onSnapshot(F.collection(fdb, col), s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), err => { console.error(col, err); if (onErr) onErr(err); });
    },
    async rquery(col) {
      if (mode === 'local') return Object.entries(store['R:' + col] || {}).map(([id, d]) => ({ id, ...d }));
      const s = await F.getDocs(F.collection(fdb, col)); return s.docs.map(d => ({ id: d.id, ...d.data() }));
    },
    async rget(path) {
      if (mode === 'local') { const p = path.split('/'); const id = p.pop(); const d = (store['R:' + p.join('/')] || {})[id]; return d ? { id, ...d } : null; }
      const s = await F.getDoc(F.doc(fdb, path)); return s.exists() ? { id: s.id, ...s.data() } : null;
    },
    rset(path, data, merge = true) {
      if (mode === 'local') {
        const p = path.split('/'); const id = p.pop(); const key = 'R:' + p.join('/');
        store[key] = store[key] || {}; store[key][id] = merge ? { ...(store[key][id] || {}), ...data } : { ...data };
        saveLocal(); notify(key); return Promise.resolve();
      }
      return F.setDoc(F.doc(fdb, path), data, { merge }).catch(e => { fail(path)(e); });
    },
    rnewId(col) { return mode === 'local' ? uid() : F.doc(F.collection(fdb, col)).id; },
    resetDemo() { localStorage.removeItem(LKEY); localStorage.removeItem('nexorapos_session'); location.reload(); },
  };
})();

/* total de una venta (precios con impuesto incluido) */
function calc(v, extra = []) {
  const items = [...(v.items || []).filter(i => i.estado !== 'anulado'), ...extra];
  const subtotal = sum(items, i => i.precio * i.cant);
  let desc = 0;
  if (v.descuento) desc = v.descuento.tipo === 'pct' ? Math.round(subtotal * v.descuento.valor / 100) : Math.min(subtotal, v.descuento.valor || 0);
  const neto = subtotal - desc;
  const envio = v.tipo === 'domicilio' ? (v.envio || 0) : 0;
  const pct = Number(S.cfg.propinaPct) || 0;
  const propSug = Math.round(neto * pct / 100 / 100) * 100;
  const impPct = Number(S.cfg.impuestoPct) || 0;
  const base = Math.round(neto / (1 + impPct / 100));
  return { items, subtotal, desc, neto, envio, propSug, base, imp: neto - base, total: neto + envio };
}

let audioCtx = null;
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.22].forEach(t => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = 880; g.gain.value = 0.15;
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.15);
    });
  } catch (e) { }
}

  const keep = {}; $$('[data-keep]', root).forEach(el => keep[el.id] = el.value);

  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); if (sel && sel[0] != null) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) { } } }

  </div>`;

function bindPlano() {
  const pl = $('#plano'); if (!pl) return;
  $$('.mesa', pl).forEach(el => {
    el.addEventListener('pointerdown', e => {
      if (window.innerWidth <= 760) return;
      const rect = pl.getBoundingClientRect();
      const sx = e.clientX, sy = e.clientY, ox = el.offsetLeft, oy = el.offsetTop;
      let moved = false; S.dragging = true;
      try { el.setPointerCapture(e.pointerId); } catch (_) { }
      const mv = ev => {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (!moved && Math.hypot(dx, dy) < 5) return; moved = true;
        const nx = Math.min(Math.max(0, ox + dx), rect.width - el.offsetWidth), ny = Math.min(Math.max(0, oy + dy), rect.height - el.offsetHeight);
        el.style.left = (nx / rect.width * 100).toFixed(1) + '%'; el.style.top = (ny / rect.height * 100).toFixed(1) + '%';
      };
      const up = () => {
        el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
        S.dragging = false;
        if (moved) { suppressClick = true; setTimeout(() => suppressClick = false, 60); DB.update('mesas', el.dataset.id, { x: parseFloat(el.style.left), y: parseFloat(el.style.top) }); }
      };
      el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    });
  });
}

function vPedido() {

  const draftHTML = draft.length ? `<div class="draft"><div class="ttl">Por enviar · ${nDraft}</div>${draft.map(i => `<div class="it">

  }

  // productos
  const qn = norm(S.q);
  const prods = S.productos.filter(p => p.activo !== false && (S.catId === 'all' || p.categoriaId === S.catId) && (!qn || norm(p.nombre).includes(qn)));
  const dq = {}; draft.forEach(i => dq[i.productoId] = (dq[i.productoId] || 0) + i.cant);

      ${editable ? `
        ${draft.length ? `<button class="btn ok lg block" data-act="enviar">Enviar a cocina (${nDraft})</button>` : ''}
        <div class="acts"><button class="btn" data-act="precuenta">Precuenta</button><button class="btn" data-act="descuento" ${perm('descuentos') ? '' : 'disabled'}>Descuento</button><button class="btn" data-act="masVenta">Más…</button></div>
        ${perm('cobrar') ? `<button class="btn pri lg block" data-act="cobrar" ${c.total <= 0 ? 'disabled' : ''}>Cobrar ${money(c.total)}</button>` : ''}
      ` : `<button class="btn block" data-act="reimprimir" data-id="${v.id}">Reimprimir comprobante</button>`}
    </div></div>`;

  return topHTML(esc(tituloVenta(v)), tags.join(''), 'backPedido') +
    `<div class="mtabs"><button class="${!S.showAcct ? 'on' : ''}" data-act="showAcct" data-v="0">Productos</button><button class="${S.showAcct ? 'on' : ''}" data-act="showAcct" data-v="1">Cuenta · ${money(c.total)}${nDraft ? ` <span class="tag warn">${nDraft} sin enviar</span>` : ''}</button></div>
    <div class="pv ${S.showAcct ? 'show-acct' : ''}">${left}${right}</div>`;
}

/* envía lo pendiente: confirma productos y crea la comanda de cocina */
function enviarDraft(v, silent = false) {
  const draft = S.drafts[v.id] || [];
  if (!draft.length) return [];
  const t = now();
  const items = draft.map(i => ({ ...i, id: uid(), estado: 'enviado', enviadoEn: t, por: S.user.nombre }));
  DB.append('ventas', v.id, 'items', items, v.tipo === 'mesa' ? { precuentaEn: null } : {});
  const coc = items.filter(i => i.cocina);
  if (coc.length) {
    DB.add('comandas', { ventaId: v.id, tipo: v.tipo, titulo: tituloVenta(v), meseroNombre: v.meseroNombre || (v.cliente && v.cliente.nombre) || '', items: coc.map(i => ({ nombre: i.nombre, cant: i.cant, nota: i.nota || '' })), estado: 'pendiente', anulacion: false, creadaEn: t });
    if (S.cfg.imprimirComanda) printComanda(v, coc);
  }
  delete S.drafts[v.id]; saveDrafts();
  if (!silent) toast(coc.length ? 'Pedido enviado a cocina' : 'Productos agregados', 'ok');
  return items;
}
A.enviar = () => { const v = gVenta(S.ventaId); if (v) { enviarDraft(v); render(); } };

A.anularItem = el => {
  const v = gVenta(S.ventaId); const i = (v.items || []).find(x => x.id === el.dataset.id); if (!i) return;
  MODAL = { type: 'anular', itemId: i.id, cant: i.cant, max: i.cant };
  const mot = ['Error al tomar el pedido', 'El cliente cambió de opinión', 'Se demoró mucho', 'Producto agotado'];
  openModal(`${mHead('Anular ' + esc(i.nombre))}<div class="mb">
    ${i.cant > 1 ? `<div class="field"><label>Cantidad a anular</label><div class="stepper"><button data-act="anCant" data-d="-1">−</button><b id="an_c">${i.cant}</b><button data-act="anCant" data-d="1">+</button><span class="muted small">de ${i.cant}</span></div></div>` : ''}
    <div class="field"><label>Motivo (obligatorio)</label><div class="chips">${mot.map(m => `<button data-act="anMot" data-t="${esc(m)}">${m}</button>`).join('')}</div><input class="inp" id="an_m" placeholder="Escribe el motivo"></div>

A.anMot = el => { $('#an_m').value = el.dataset.t; };
A.confAnular = () => {
  const motivo = $('#an_m').value.trim(); if (!motivo) return toast('Escribe el motivo', 'err');
  const v = gVenta(S.ventaId); const { itemId, cant } = MODAL;
  const it = (v.items || []).find(x => x.id === itemId);
  const meta = { estado: 'anulado', anuladoMotivo: motivo, anuladoPor: S.user.nombre, anuladoEn: now() };
  DB.mutate('ventas', v.id, d => {
    const items = [];
    (d.items || []).forEach(i => {
      if (i.id !== itemId || i.estado === 'anulado') { items.push(i); return; }
      if (cant >= i.cant) items.push({ ...i, ...meta });
      else { items.push({ ...i, cant: i.cant - cant }); items.push({ ...i, id: uid(), cant, ...meta }); }
    });
    return { items };
  }, v);
  if (it && it.cocina) DB.add('comandas', { ventaId: v.id, tipo: v.tipo, titulo: tituloVenta(v), meseroNombre: S.user.nombre, items: [{ nombre: it.nombre, cant, nota: 'Motivo: ' + motivo }], estado: 'pendiente', anulacion: true, creadaEn: now() });
  closeModal(); toast('Producto anulado');
};

A.descuento = () => {

    <div class="field"><label id="ds_l">${d.tipo === 'pct' ? 'Porcentaje' : 'Valor'}</label><input class="inp ${d.tipo === 'valor' ? 'money' : ''}" id="ds_v" inputmode="numeric" value="${d.valor ? (d.tipo === 'valor' ? num(d.valor) : d.valor) : ''}" autofocus></div>

A.saveDesc = () => {

  if (MODAL.tipo === 'valor' && val > 0 && val < 1000) val *= 1000;

};

};

/* ===================== cobrar ===================== */
let PAY = null;
A.cobrar = () => {
  const v = gVenta(S.ventaId); if (!v) return;
  if (!perm('cobrar')) return toast('No tienes permiso para cobrar', 'err');
  if (!S.arqueo) {
    MODAL = { type: 'cajaCerrada' };
    openModal(`${mHead('La caja está cerrada')}<div class="mb"><p>Para cobrar primero hay que abrir la caja del turno.</p></div><div class="mf"><button class="btn" data-act="closeModal">Cancelar</button>${perm('caja') ? '<button class="btn pri" data-act="irCaja" data-primary>Ir a Caja</button>' : ''}</div>`);
    return;
  }
  const draft = S.drafts[v.id] || [];
  const c = calc(v, draft);
  if (c.total <= 0) return toast('La cuenta está en cero', 'err');
  PAY = { vid: v.id, c, propinaOn: v.tipo === 'mesa' && c.propSug > 0, propina: c.propSug, pagos: [], imprimir: true };
  MODAL = { type: 'pay' };
  openModal(payHTML(v), true);
  payRefresh();
};
A.irCaja = () => { closeModal(); S.view = 'caja'; render(); };
const payTotal = () => PAY.c.total + (PAY.propinaOn ? PAY.propina : 0);
function payHTML(v) {
  const c = PAY.c;
  return `${mHead('Cobrar · ' + esc(tituloVenta(v)))}<div class="mb">
    <div class="card pad" style="box-shadow:none;margin-bottom:14px">
      <div class="tot"><span>Subtotal</span><span>${money(c.subtotal)}</span></div>
      ${c.desc ? `<div class="tot"><span>Descuento</span><span>− ${money(c.desc)}</span></div>` : ''}
      ${c.envio ? `<div class="tot"><span>Domicilio</span><span>${money(c.envio)}</span></div>` : ''}
      <div class="row between" style="margin:6px 0">
        <label class="chk" style="min-height:30px"><input type="checkbox" id="pay_pon" data-ch="payPropOn" ${PAY.propinaOn ? 'checked' : ''}> Propina voluntaria</label>
        <input class="inp money" id="pay_prop" data-in="payProp" style="width:130px;min-height:36px;text-align:right" value="${num(PAY.propina)}" ${PAY.propinaOn ? '' : 'disabled'}>
      </div>
      <div class="tot big"><span>Total a pagar</span><span id="pay_tot">${money(payTotal())}</span></div>
    </div>
    <label style="font-size:13px;font-weight:650;color:var(--ink2)">Medio de pago</label>
    <div class="medios">${medios().map(m => `<button data-act="payAdd" data-m="${esc(m)}">${esc(m)}</button>`).join('')}</div>
    <div id="pay_rows">${payRowsHTML()}</div>
    <div class="paysum" id="pay_stat"></div>
    <label class="chk" style="margin-top:8px"><input type="checkbox" id="pay_pr" ${PAY.imprimir ? 'checked' : ''}> Imprimir comprobante</label>
  </div><div class="mf"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn ok lg" id="pay_ok" data-act="payConfirm" data-primary>Confirmar pago</button></div>`;
}
function payRowsHTML() {
  return PAY.pagos.map((p, i) => `<div class="payrow"><span class="pm">${esc(p.medio)}</span><input class="inp money" id="pay_r${i}" data-in="payRow" data-i="${i}" inputmode="numeric" value="${num(p.monto)}"><button class="xbtn" data-act="payDel" data-i="${i}">×</button></div>`).join('');
}
function payState() {
  const total = payTotal(); const pagado = sum(PAY.pagos, p => p.monto);
  const ef = sum(PAY.pagos.filter(p => p.medio === 'Efectivo'), p => p.monto);
  if (pagado < total) return { ok: false, cls: 'falta', txt: ['Falta', money(total - pagado)] };
  const exc = pagado - total;
  if (exc > 0 && exc > ef) return { ok: false, cls: 'falta', txt: ['Los pagos electrónicos superan el total', money(exc)] };
  return { ok: PAY.pagos.length > 0, cls: 'okk', txt: exc > 0 ? ['Cambio para el cliente', money(exc)] : ['Pago completo', '✓'], cambio: exc };
}
function payRefresh() {
  const st = payState();
  const el = $('#pay_stat'); if (!el) return;
  el.className = 'paysum ' + st.cls; el.innerHTML = `<span>${st.txt[0]}</span><span>${st.txt[1]}</span>`;
  $('#pay_tot').textContent = money(payTotal());
  $('#pay_ok').disabled = !st.ok;
}
A.payAdd = el => {
  const rest = Math.max(0, payTotal() - sum(PAY.pagos, p => p.monto));
  const ex = PAY.pagos.find(p => p.medio === el.dataset.m);
  if (ex) ex.monto += rest; else PAY.pagos.push({ medio: el.dataset.m, monto: rest });
  $('#pay_rows').innerHTML = payRowsHTML(); payRefresh();
  const idx = PAY.pagos.findIndex(p => p.medio === el.dataset.m);
  const inp = $('#pay_r' + idx); if (inp) { inp.focus(); inp.select(); }
};
A.payDel = el => { PAY.pagos.splice(+el.dataset.i, 1); $('#pay_rows').innerHTML = payRowsHTML(); payRefresh(); };
A.payConfirm = () => {
  const st = payState(); if (!st.ok) return;
  const v = gVenta(PAY.vid); if (!v) return;
  const nuevos = enviarDraft(v, true);
  const cambio = st.cambio || 0;
  const pagos = PAY.pagos.map(p => ({ ...p }));
  if (cambio > 0) { const ef = pagos.find(p => p.medio === 'Efectivo'); ef.recibido = ef.monto; ef.monto -= cambio; }
  const propina = PAY.propinaOn ? PAY.propina : 0;
  const c = PAY.c;
  const patch = {
    estado: 'cerrada', cerradaEn: now(), cerradaPor: S.user.nombre, pagos: pagos.filter(p => p.monto > 0 || p.recibido), cambio,
    subtotal: c.subtotal, descuentoValor: c.desc, envio: c.envio, propina, total: c.total, arqueoId: S.arqueo.id,
  };
  DB.update('ventas', v.id, patch);
  const imprimir = $('#pay_pr').checked;
  closeModal();
  if (imprimir) printComprobante({ ...v, ...patch, items: [...(v.items || []), ...nuevos] });
  toast(cambio > 0 ? 'Venta cerrada · Cambio ' + money(cambio) : 'Venta cerrada', 'ok');
  if (v.tipo === 'mesa') S.view = 'salon'; else S.view = 'pedidos';
  if (!canView(S.view)) S.view = defaultView();
  PAY = null; render();
};

/* ===================== pedidos: mostrador y domicilios ===================== */
function vPedidos() {
  const list = activePedidos().sort((a, b) => a.abiertaEn - b.abiertaEn);
  const ET = { preparando: ['warn', 'En preparación'], listo: ['ok', 'Listo'], camino: ['info', 'En camino'] };
  const card = v => {
    const pagado = v.estado === 'cerrada';
    const total = pagado ? (v.total || 0) + (v.propina || 0) : calc(v, S.drafts[v.id] || []).total;
    const et = ET[v.etapa] || ET.preparando;
    let next = '';
    if (v.etapa === 'preparando' || !v.etapa) next = `<button class="btn sm" data-act="etapa" data-id="${v.id}" data-e="listo">Marcar listo</button>`;
    else if (v.etapa === 'listo' && v.tipo === 'domicilio') next = `<button class="btn sm" data-act="etapa" data-id="${v.id}" data-e="camino">Salió a entregar</button>`;
    if ((v.etapa === 'listo' && v.tipo !== 'domicilio') || v.etapa === 'camino') next += pagado ? `<button class="btn sm ok" data-act="etapa" data-id="${v.id}" data-e="entregado">Entregado</button>` : '';
    if (!pagado && perm('cobrar')) next += `<button class="btn sm pri" data-act="cobrarPedido" data-id="${v.id}">Cobrar</button>`;
    const cl = v.cliente || {};
    const n = sum((v.items || []).filter(i => i.estado !== 'anulado'), i => i.cant);
    return `<div class="card oc" data-act="openPedido" data-id="${v.id}">
      <div class="row between"><h3>${esc(tituloVenta(v))}</h3><span class="tag ${v.tipo === 'domicilio' ? 'info' : ''}">${v.tipo === 'domicilio' ? 'Domicilio' : 'Mostrador'}</span></div>
      ${cl.nombre || cl.telefono ? `<div class="small"><b>${esc(cl.nombre || '')}</b> ${cl.telefono ? '· ' + esc(cl.telefono) : ''}</div>` : ''}
      ${cl.direccion ? `<div class="small muted">📍 ${esc(cl.direccion)}${cl.referencia ? ' · ' + esc(cl.referencia) : ''}</div>` : ''}
      <div class="row between small"><span class="muted">${n} productos · hace ${durTxt(v.abiertaEn)}</span><b style="font-size:16px">${money(total)}</b></div>
      <div class="row wrap"><span class="tag ${et[0]}">${et[1]}</span><span class="tag ${pagado ? 'ok' : 'bad'}">${pagado ? 'Pagado' : 'Por cobrar'}</span>${(S.drafts[v.id] || []).length ? '<span class="tag warn">Sin enviar</span>' : ''}</div>
      ${next ? `<div class="row wrap">${next}</div>` : ''}
    </div>`;

/* ===================== caja ===================== */
function cajaCalc() {
  const a = S.arqueo;
  const vs = S.ventasCaja.filter(v => v.estado === 'cerrada');
  const porMedio = {}; vs.forEach(v => (v.pagos || []).forEach(p => porMedio[p.medio] = (porMedio[p.medio] || 0) + (p.monto || 0)));
  const movM = {}; S.movs.forEach(m => movM[m.medio] = (movM[m.medio] || 0) + (m.tipo === 'ingreso' ? m.monto : -m.monto));
  const ms = [...new Set(['Efectivo', ...medios(), ...Object.keys(porMedio), ...Object.keys(movM)])];
  const sistema = {}; ms.forEach(m => sistema[m] = (porMedio[m] || 0) + (movM[m] || 0) + (m === 'Efectivo' ? (a.base || 0) : 0));
  return {
    vs, porMedio, movM, ms, sistema,
    ventasTotal: sum(vs, v => v.total), propinas: sum(vs, v => v.propina),
    ingresos: sum(S.movs.filter(m => m.tipo === 'ingreso'), m => m.monto), egresos: sum(S.movs.filter(m => m.tipo === 'egreso'), m => m.monto),
  };
}

    <div class="kpis">
      <div class="card kpi"><div class="l">Ventas del turno</div><div class="v">${money(k.ventasTotal)}</div><div class="muted small">${k.vs.length} cuentas cerradas</div></div>
      <div class="card kpi"><div class="l">Efectivo en caja</div><div class="v">${money(k.sistema.Efectivo)}</div><div class="muted small">incluye base de ${money(a.base)}</div></div>
      <div class="card kpi"><div class="l">Propinas</div><div class="v">${money(k.propinas)}</div><div class="muted small">para el personal</div></div>
      <div class="card kpi"><div class="l">Cuentas abiertas</div><div class="v">${abiertas}</div><div class="muted small">mesas y pedidos sin cobrar</div></div>

      <div class="card pad"><h3 class="sec-t">Por medio de pago</h3>
        ${k.ms.map(m => `<div class="list-row"><span>${esc(m)}${m === 'Efectivo' ? `<div class="muted small">Base ${money(a.base)} + ventas ${money(k.porMedio.Efectivo || 0)}${k.movM.Efectivo ? ' ' + (k.movM.Efectivo > 0 ? '+ ' : '− ') + money(Math.abs(k.movM.Efectivo)) + ' mov.' : ''}</div>` : ''}</span><b>${money(k.sistema[m])}</b></div>`).join('')}
        <div class="list-row" style="font-weight:800"><span>Total</span><span>${money(sum(Object.values(k.sistema)))}</span></div>

    ${perm('caja') ? '<div style="margin-top:16px"><button class="btn bad lg" data-act="cerrarCaja">Cerrar caja</button></div>' : ''}
    ${histHTML}</div>`;

/* ===================== ventas y reportes ===================== */
let LAST_VENTAS = [];
function vVentas() {

      S.ventasDiaData = { dia, list: null };
      DB.query('ventas', [['cerradaEn', '>=', st], ['cerradaEn', '<', en]]).then(l => { if (S.ventasDiaData && S.ventasDiaData.dia === dia) { S.ventasDiaData.list = l; render(); } }).catch(e => { console.error(e); toast('No se pudieron cargar las ventas', 'err'); });

  LAST_VENTAS = list;
  const ok = list.filter(v => v.estado === 'cerrada'), anul = list.filter(v => v.estado === 'anulada');
  const tot = sum(ok, v => v.total), prop = sum(ok, v => v.propina), desc = sum(ok, v => v.descuentoValor);
  const pers = sum(ok.filter(v => v.tipo === 'mesa'), v => v.personas);
  const porMedio = {}; ok.forEach(v => (v.pagos || []).forEach(p => porMedio[p.medio] = (porMedio[p.medio] || 0) + p.monto));
  const porTipo = {}; ok.forEach(v => { const t = porTipo[v.tipo] = porTipo[v.tipo] || { n: 0, t: 0 }; t.n++; t.t += v.total || 0; });
  const porMes = {}; ok.filter(v => v.tipo === 'mesa').forEach(v => { const k = v.meseroNombre || 'Sin mesero'; const t = porMes[k] = porMes[k] || { n: 0, t: 0, p: 0 }; t.n++; t.t += v.total || 0; t.p += v.propina || 0; });
  const prods = {}; ok.forEach(v => (v.items || []).filter(i => i.estado !== 'anulado').forEach(i => { const p = prods[i.nombre] = prods[i.nombre] || { c: 0, t: 0 }; p.c += i.cant; p.t += i.cant * i.precio; }));
  const top = Object.entries(prods).sort((a, b) => b[1].c - a[1].c).slice(0, 10);
  const TN = { mesa: 'Mesas', mostrador: 'Mostrador', domicilio: 'Domicilios' };
  const listCard = (title, rows) => `<div class="card pad"><h3 class="sec-t">${title}</h3>${rows || '<p class="muted small">Sin datos</p>'}</div>`;
  return head + `<div class="wrap">
    <div class="kpis">
      <div class="card kpi"><div class="l">Ventas</div><div class="v">${money(tot)}</div><div class="muted small">sin propinas</div></div>
      <div class="card kpi"><div class="l">Cuentas</div><div class="v">${ok.length}</div><div class="muted small">${anul.length} anuladas</div></div>
      <div class="card kpi"><div class="l">Ticket promedio</div><div class="v">${money(ok.length ? tot / ok.length : 0)}</div><div class="muted small">${pers} personas en mesa</div></div>
      <div class="card kpi"><div class="l">Propinas</div><div class="v">${money(prop)}</div><div class="muted small">descuentos ${money(desc)}</div></div>
    </div>
    <div class="grid3" style="align-items:start;margin-bottom:16px">

document.addEventListener('click', e => {
  const m = $('#modal');
  if (e.target === m) { closeModal(); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (fn) fn(el, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.classList && el.classList.contains('money')) {
    const fromEnd = el.value.length - (el.selectionStart ?? el.value.length);
    const v = parseMoney(el.value); el.value = v ? num(v) : '';
    try { const p = Math.max(0, el.value.length - fromEnd); el.setSelectionRange(p, p); } catch (_) { }
  }
  const k = el.dataset && el.dataset.in; if (k && IN[k]) IN[k](el, e);
});
document.addEventListener('focusout', e => {
  const el = e.target;
  if (el.classList && el.classList.contains('money')) {
    const v = parseMoney(el.value);
    if (v > 0 && v < 1000) { el.value = num(v * 1000); el.dispatchEvent(new Event('input', { bubbles: true })); }
  }
});
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.ch; if (k && CH[k]) CH[k](e.target, e); });
document.addEventListener('keydown', e => {
  if (S.screen === 'pin' && PINST.userId) {
    if (/^\d$/.test(e.key)) pinPress(e.key); else if (e.key === 'Backspace') A.pinDel(); else if (e.key === 'Escape') A.pinBack();
    return;
  }
  if (e.key === 'Escape' && modalOpen()) { closeModal(); return; }
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
    const t = e.target;
    if (t.dataset.enter && A[t.dataset.enter]) { A[t.dataset.enter](t); return; }
    if (modalOpen()) { t.blur(); setTimeout(() => { const b = $('#modal [data-primary]'); if (b && !b.disabled) b.click(); }, 0); }
  }
});

}, 30000);

  const vencidos = rows.filter(r => r.s.k === 'vencida' || r.s.k === 'bloqueada');
  return head + `<div class="wrap">
    <div class="kpis">
      <div class="card kpi"><div class="l">Ingreso mensual</div><div class="v">${money(sum(activos, r => r.l.valor))}</div><div class="muted small">${activos.length} clientes activos</div></div>
      <div class="card kpi"><div class="l">Por vencer (5 días)</div><div class="v">${porVencer.length}</div><div class="muted small">${money(sum(porVencer, r => r.l.valor))}</div></div>
      <div class="card kpi"><div class="l">Vencidos o bloqueados</div><div class="v" style="color:${vencidos.length ? 'var(--bad)' : 'inherit'}">${vencidos.length}</div><div class="muted small">${money(sum(vencidos, r => r.l.valor))} por cobrar</div></div>
    </div>
    <div class="card" style="overflow:auto">${rows.length ? `<table class="tbl"><thead><tr><th>Negocio</th><th class="num">Mensualidad</th><th>Pagado hasta</th><th>Estado</th><th></th></tr></thead><tbody>
    ${rows.map(({ l, s }) => { const lb = LIC_LABEL[s.k]; return `<tr class="click" data-act="adDetalle" data-id="${l.id}">
      <td><b>${esc(l.negocio || '(sin nombre)')}</b><div class="muted small">${esc(l.telefono || 'sin teléfono')}</div></td>
      <td class="num"><b>${money(l.valor)}</b></td>
      <td>${fecha(l.pagadoHasta)}<div class="muted small">${relTxt(s)}</div></td>
      <td><span class="tag ${lb[0]}">${lb[1]}</span></td>
      <td><div class="row" style="justify-content:flex-end;flex-wrap:wrap"><button class="btn sm ok" data-act="adPago" data-id="${l.id}">Registrar pago</button><a class="btn sm" data-act="noop" href="${waCobro(l)}" target="_blank" rel="noopener">Cobrar por WhatsApp</a><button class="btn sm" data-act="adEditar" data-id="${l.id}">Editar</button></div></td>
    </tr>`; }).join('')}</tbody></table>` : '<div class="empty">Todavía no tienes clientes. Crea el primero con "+ Nuevo cliente".</div>'}</div>
    <p class="muted small" style="margin-top:12px">Cómo funciona: 5 días antes del vencimiento el administrador del restaurante ve un aviso. Si se vence, tiene los días de gracia con un aviso rojo; después el sistema se bloquea hasta que registres el pago aquí. Al registrarlo se desbloquea solo, sin recargar.</p>
  </div></div>`;
}

A.adCopyUid = () => { try { navigator.clipboard.writeText(S.authUid); toast('UID copiado', 'ok'); } catch (e) { } };

/* ---------- registrar pago ---------- */
function nuevoHasta(l, meses) {
  const base = (l.pagadoHasta && l.pagadoHasta > Date.now() - 30 * 864e5) ? l.pagadoHasta : endOfDay(Date.now());
  return addMonths(base, meses);
}
A.adPago = el => {
  const l = adLic(el.dataset.id); if (!l) return;
  MODAL = { type: 'adPago', id: l.id };
  openModal(`${mHead('Registrar pago · ' + esc(l.negocio))}<div class="mb">
    <div class="grid2"><div class="field"><label>Meses que paga</label><select class="inp" id="ap_n" data-ch="adMeses">${[1, 2, 3, 6, 12].map(n => `<option value="${n}">${n} ${n === 1 ? 'mes' : 'meses'}</option>`).join('')}</select></div>
    <div class="field"><label>Valor recibido</label><input class="inp money" id="ap_m" inputmode="numeric" value="${num(l.valor)}"></div></div>
    <div class="grid2"><div class="field"><label>Medio de pago</label><select class="inp" id="ap_med">${MEDIOS_COBRO.map(m => `<option>${m}</option>`).join('')}</select></div>
    <div class="field"><label>Fecha del pago</label><input class="inp" type="date" id="ap_f" value="${dayInput(Date.now())}"></div></div>
    <div class="field"><label>Nota</label><input class="inp" id="ap_nota" placeholder="Ej: número del comprobante"></div>
    <div class="paysum okk" id="ap_prev"></div>
    <label class="chk" style="margin-top:8px"><input type="checkbox" id="ap_rec" checked> Imprimir recibo de pago</label>
  </div><div class="mf"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn ok" data-act="adGuardarPago" data-primary>Registrar pago</button></div>`);
  adPrev();
};
function adPrev() {
  const l = adLic(MODAL && MODAL.id); const el = $('#ap_prev'); if (!l || !el) return;
  el.innerHTML = `<span>Queda pagado hasta</span><span>${fecha(nuevoHasta(l, +$('#ap_n').value))}</span>`;
}
CH.adMeses = el => { const l = adLic(MODAL.id); if (l) $('#ap_m').value = num((l.valor || 0) * +el.value); adPrev(); };
A.adGuardarPago = () => {
  const l = adLic(MODAL.id); if (!l) return;
  const n = +$('#ap_n').value; let m = parseMoney($('#ap_m').value); if (m > 0 && m < 1000) m *= 1000;
  if (!(m > 0)) return toast('Escribe el valor recibido', 'err');
  const fv = $('#ap_f').value; const fp = fv ? new Date(fv + 'T12:00:00').getTime() : now();
  const numero = (l.pagosCount || 0) + 1;
  const pago = { fecha: fp, monto: m, meses: n, medio: $('#ap_med').value, nota: $('#ap_nota').value.trim(), desde: l.pagadoHasta || null, hasta: nuevoHasta(l, n), registradoEn: now(), numero };
  const pid = DB.rnewId('licencias/' + l.id + '/pagos');
  DB.rset(`licencias/${l.id}/pagos/${pid}`, pago, false);
  DB.rset('licencias/' + l.id, { pagadoHasta: pago.hasta, estado: 'activa', ultimoPago: fp, ultimoMonto: m, pagosCount: numero });
  const rec = $('#ap_rec').checked;
  closeModal(); toast(`Pago registrado · ${l.negocio} queda al día hasta el ${fecha(pago.hasta)}`, 'ok');
  if (rec) printRecibo(l, pago);
};
function printRecibo(l, p) {
  const nro = 'NX-' + String(l.id).slice(0, 4).toUpperCase() + '-' + String(p.numero || 1).padStart(3, '0');
  printHTML(`<div class="c xl">${esc(NEXORA_INFO.nombre)}</div><div class="c">${esc(NEXORA_INFO.by)}</div>
    <div class="c" style="font-size:11px">${esc(NEXORA_INFO.lema)} · Tel. ${esc(NEXORA_INFO.telefono)}</div><hr>
    <div class="r b l"><span>RECIBO DE PAGO</span><span>No. ${nro}</span></div>
    <div class="r"><span>Fecha del pago</span><span>${fecha(p.fecha)}</span></div><hr>
    <p><b>Recibimos de:</b> ${esc(l.negocio)}</p>
    <p><b>La suma de:</b> ${money(p.monto)}</p>
    <p><b>Por concepto de:</b> mensualidad del sistema NEXORA POS (${p.meses} ${p.meses === 1 ? 'mes' : 'meses'})${p.desde ? `, periodo del ${fecha(p.desde + 1)} al ${fecha(p.hasta)}` : `, servicio hasta el ${fecha(p.hasta)}`}.</p>
    <p><b>Medio de pago:</b> ${esc(p.medio)}${p.nota ? ' · ' + esc(p.nota) : ''}</p><hr>
    <br><br><div>______________________________</div><div>${esc(NEXORA_INFO.nombre)}</div>`, true);
}

/* ---------- detalle e historial ---------- */
A.adDetalle = async el => {
  const l = adLic(el.dataset.id); if (!l) return;
  const s = licStatus(l); const lb = LIC_LABEL[s.k];
  MODAL = { type: 'adDetalle', id: l.id, pagos: [] };
  const draw = pagos => openModal(`${mHead(esc(l.negocio))}<div class="mb">
    <div class="list-row"><span>Estado</span><span class="tag ${lb[0]}">${lb[1]}</span></div>
    <div class="list-row"><span>Mensualidad</span><b>${money(l.valor)}</b></div>
    <div class="list-row"><span>Pagado hasta</span><b>${fecha(l.pagadoHasta)}</b></div>
    <div class="list-row"><span>Días de gracia</span><b>${l.diasGracia ?? 3}</b></div>
    <div class="list-row"><span>Código del negocio</span><b class="small">${esc(l.id)}</b></div>
    ${l.notas ? `<p class="small muted" style="margin-top:8px">${esc(l.notas)}</p>` : ''}
    <h4 style="margin:16px 0 4px;font-size:14px">Pagos</h4>
    ${pagos === null ? '<p class="muted small">Cargando…</p>' : pagos.length ? pagos.map((p, i) => `<div class="list-row"><span>${fecha(p.fecha)} <span class="muted small">· ${esc(p.medio || '')} · ${p.meses} ${p.meses === 1 ? 'mes' : 'meses'} · hasta ${fecha(p.hasta)}</span></span><span class="row"><b>${money(p.monto)}</b><button class="btn sm" data-act="adRecibo" data-i="${i}">Recibo</button></span></div>`).join('') : '<p class="muted small">Sin pagos registrados.</p>'}
  </div><div class="mf"><button class="btn" data-act="adEditar" data-id="${l.id}" style="margin-right:auto">Editar</button><a class="btn" href="${waCobro(l)}" target="_blank" rel="noopener">Cobrar por WhatsApp</a><button class="btn ok" data-act="adPago" data-id="${l.id}">Registrar pago</button></div>`, true);
  draw(null);
  try {
    const pagos = (await DB.rquery('licencias/' + l.id + '/pagos')).sort((a, b) => (b.fecha || 0) - (a.fecha || 0));
    if (MODAL && MODAL.type === 'adDetalle' && MODAL.id === l.id) { MODAL.pagos = pagos; draw(pagos); }
  } catch (e) { toast('No se pudo cargar el historial', 'err'); }
};
A.adRecibo = el => { const l = adLic(MODAL.id); const p = MODAL.pagos[+el.dataset.i]; if (l && p) printRecibo(l, p); };

/* ---------- crear / editar licencia ---------- */
function adForm(l) {
  const aj = S.ad.aj || {}; const nuevo = !l;
  const d = l || { valor: aj.valor || 99000, diasGracia: 3, instrucciones: aj.instrucciones || '', whatsapp: aj.whatsapp || SOPORTE_WHATSAPP, linkPago: aj.linkPago || '', pagadoHasta: addMonths(endOfDay(Date.now()), 1), estado: 'activa' };
  MODAL = { type: 'adForm', id: l ? l.id : null };
  openModal(`${mHead(nuevo ? 'Nuevo cliente' : 'Editar ' + esc(l.negocio))}<div class="mb">
    <div class="field"><label>Código del negocio</label><input class="inp" id="af_id" value="${esc(l ? l.id : '')}" ${nuevo ? 'autofocus placeholder="Lo ve el cliente en la pantalla de activación"' : 'readonly'}></div>
    <div class="grid2"><div class="field"><label>Nombre del negocio</label><input class="inp" id="af_neg" value="${esc(d.negocio || '')}"></div>
    <div class="field"><label>WhatsApp del cliente</label><input class="inp" id="af_tel" inputmode="tel" value="${esc(d.telefono || '')}" placeholder="300 000 0000"></div></div>
    <div class="grid3"><div class="field"><label>Mensualidad</label><input class="inp money" id="af_val" inputmode="numeric" value="${num(d.valor)}"></div>
    <div class="field"><label>Pagado hasta</label><input class="inp" type="date" id="af_hasta" value="${dayInput(d.pagadoHasta || Date.now())}"></div>
    <div class="field"><label>Días de gracia</label><input class="inp" type="number" min="0" max="30" id="af_g" value="${d.diasGracia ?? 3}"></div></div>
    <div class="field"><label>Instrucciones de pago (las ve el cliente)</label><textarea class="inp" id="af_ins" placeholder="Ej: Nequi 300 000 0000 a nombre de …">${esc(d.instrucciones || '')}</textarea></div>
    <div class="grid2"><div class="field"><label>Link de pago (opcional)</label><input class="inp" id="af_link" value="${esc(d.linkPago || '')}" placeholder="https://…"></div>
    <div class="field"><label>Tu WhatsApp de cobro</label><input class="inp" id="af_wa" inputmode="tel" value="${esc(d.whatsapp || '')}"></div></div>
    ${nuevo ? '' : `<div class="field"><label>Estado</label><select class="inp" id="af_est"><option value="activa">Activa</option><option value="suspendida" ${d.estado === 'suspendida' ? 'selected' : ''}>Suspendida (se bloquea al cambiar de usuario o abrir la app)</option></select></div>`}
    <div class="field"><label>Notas internas</label><input class="inp" id="af_not" value="${esc(d.notas || '')}"></div>
  </div><div class="mf"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn pri" data-act="adGuardar" data-primary>${nuevo ? 'Crear licencia' : 'Guardar'}</button></div>`, true);
}
A.adNuevo = () => adForm(null);
A.adEditar = el => { const l = adLic(el.dataset.id); if (l) adForm(l); };
A.adGuardar = async () => {
  const id = $('#af_id').value.trim(), neg = $('#af_neg').value.trim();
  if (!id || /[\/\s]/.test(id)) return toast('Pega el código del negocio (sin espacios)', 'err');
  if (!neg) return toast('Escribe el nombre del negocio', 'err');
  let val = parseMoney($('#af_val').value); if (val > 0 && val < 1000) val *= 1000;
  const hv = $('#af_hasta').value; if (!hv) return toast('Elige la fecha de pagado hasta', 'err');
  const link = $('#af_link').value.trim(); if (link && !safeUrl(link)) return toast('El link de pago debe empezar por https://', 'err');
  const data = {
    negocio: neg, telefono: $('#af_tel').value.trim(), valor: val, pagadoHasta: endOfDay(new Date(hv + 'T12:00:00').getTime()),
    diasGracia: Math.min(30, Math.max(0, parseInt($('#af_g').value, 10) || 0)), instrucciones: $('#af_ins').value.trim(), linkPago: link,
    whatsapp: $('#af_wa').value.replace(/\D/g, '') || SOPORTE_WHATSAPP, notas: $('#af_not').value.trim(),
  };
  if (MODAL.id) { data.estado = $('#af_est').value; DB.rset('licencias/' + id, data); closeModal(); toast('Guardado', 'ok'); return; }
  try { if (await DB.rget('licencias/' + id)) return toast('Ese código ya tiene licencia', 'err'); } catch (e) { return toast('No se pudo verificar: ' + (e.code || e.message), 'err'); }
  DB.rset('licencias/' + id, { ...data, estado: 'activa', creado: now(), pagosCount: 0 }, false);
  closeModal(); toast('Licencia creada · ' + neg, 'ok');
};

/* ---------- datos de cobro por defecto ---------- */
A.adAjustes = () => {
  const aj = S.ad.aj || {};
  MODAL = { type: 'adAjustes' };
  openModal(`${mHead('Datos de cobro')}<div class="mb">
    <p class="muted small" style="margin-bottom:10px">Se usan por defecto en los clientes nuevos.</p>
    <div class="grid2"><div class="field"><label>Mensualidad por defecto</label><input class="inp money" id="aj2_val" inputmode="numeric" value="${num(aj.valor || 99000)}"></div>
    <div class="field"><label>Tu WhatsApp de cobro</label><input class="inp" id="aj2_wa" value="${esc(aj.whatsapp || SOPORTE_WHATSAPP)}"></div></div>
    <div class="field"><label>Instrucciones de pago</label><textarea class="inp" id="aj2_ins" placeholder="Ej: Nequi 300 000 0000 a nombre de …">${esc(aj.instrucciones || '')}</textarea></div>
    <div class="field"><label>Link de pago (opcional)</label><input class="inp" id="aj2_link" value="${esc(aj.linkPago || '')}" placeholder="https://…"></div>
    <label class="chk"><input type="checkbox" id="aj2_all"> Actualizar también las instrucciones, el link y el WhatsApp de todos los clientes</label>
  </div><div class="mf"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn pri" data-act="adGuardarAj" data-primary>Guardar</button></div>`);
};
A.adGuardarAj = () => {
  let val = parseMoney($('#aj2_val').value); if (val > 0 && val < 1000) val *= 1000;
  const link = $('#aj2_link').value.trim(); if (link && !safeUrl(link)) return toast('El link de pago debe empezar por https://', 'err');
  const d = { valor: val || 99000, whatsapp: $('#aj2_wa').value.replace(/\D/g, '') || SOPORTE_WHATSAPP, instrucciones: $('#aj2_ins').value.trim(), linkPago: link };
  DB.rset('nexora/ajustes', d);
  if ($('#aj2_all').checked) (S.ad.lics || []).forEach(l => DB.rset('licencias/' + l.id, { instrucciones: d.instrucciones, linkPago: d.linkPago, whatsapp: d.whatsapp }));
  closeModal(); toast('Datos de cobro guardados', 'ok');
};

/* ===================== inicio ===================== */
if (location.hash === '#nexora') bootAdmin(); else boot();
window.addEventListener('hashchange', () => location.reload());

</script>
</body>
</html>
